<style>

/* Layout: one narrow phone column, paper-white sheet, ink-black type; photos are the only color. */
:root {
  --bg: #ffffff;
  --fg: #111111;
  --muted: #6e6e6e;
  --line: #e6e6e6;
  --soft: #f4f4f4;
  --ink-inv: #ffffff;
  --mark: rgba(255, 214, 0, .45);
  --font-display: "Pretendard Variable", "Pretendard", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;

}
@media (prefers-color-scheme: dark) {

}
:root[data-theme="dark"] { --bg:#0d0d0d; --fg:#f2f2f2; --muted:#9a9a9a; --line:#262626; --soft:#181818; --ink-inv:#0d0d0d; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, textarea { font: inherit; color: var(--fg); }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

.app { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: 120px; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-block: 14px 10px; border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: -0.04em; line-height: 1.2; }
.tabs { display: flex; gap: 20px; margin-top: 10px; }
.tab { font-size: 14px; font-weight: 500; color: var(--muted); padding-block: 4px; border-bottom: 2px solid transparent; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--fg); }
.back { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
.icon-btn { width: 36px; height: 36px; display: inline-grid; place-items: center; border-radius: 50%; }
.icon-btn:active { background: var(--soft); }

.notice { margin-top: 14px; font-size: 12.5px; color: var(--muted); border: 1px dashed var(--line); padding: 10px 12px; }

/* Library grid */
.section-label { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 22px 0 12px; display: flex; justify-content: space-between; }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px 10px; }
@media (min-width: 520px) { .grid { gap: 22px 14px; } }
.book { text-align: left; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.cover { aspect-ratio: 2 / 3; width: 100%; max-width: 100%; background: var(--soft); border: 1px solid var(--line); overflow: hidden; display: grid; place-items: center; position: relative; }
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cover .ph { font-family: var(--font-display); font-weight: 700; font-size: 11px; padding: 6px; text-align: center; line-height: 1.35; text-wrap: balance; }
.cover .badge { position: absolute; right: 6px; bottom: 6px; background: var(--fg); color: var(--ink-inv); font-size: 11px; font-weight: 600; padding: 2px 7px; font-variant-numeric: tabular-nums; }
.book-title { font-weight: 600; font-size: 12px; line-height: 1.3; letter-spacing: -0.01em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.book-link { text-align: left; display: grid; gap: 2px; min-width: 0; }
.book-count { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.add-chip { position: absolute; right: 5px; bottom: 5px; width: 30px; height: 30px; border-radius: 50%; background: var(--fg); color: var(--ink-inv); pointer-events: none; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
.add-chip { overflow: hidden; }
.add-chip svg { position: absolute; inset: 0; width: 100%; height: 100%; }

/* Empty state */
.empty { text-align: center; padding: 56px 12px 24px; display: grid; gap: 14px; justify-items: center; }
.empty h2 { font-family: var(--font-display); font-size: 22px; font-weight: 700; margin: 0; text-wrap: balance; }
.empty p { color: var(--muted); margin: 0; max-width: 30ch; }
.steps { display: grid; gap: 10px; text-align: left; margin-top: 8px; width: 100%; max-width: 320px; }
.steps li { list-style: none; display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; font-size: 14px; }
.steps li b { width: 22px; height: 22px; display: grid; place-items: center; border: 1.5px solid var(--fg); border-radius: 50%; font-size: 12px; }
.steps ol { padding: 0; margin: 0; display: grid; gap: 10px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 20px; background: var(--fg); color: var(--ink-inv); font-weight: 600; font-size: 15px; border-radius: 999px; }
.btn.ghost { background: transparent; color: var(--fg); border: 1.5px solid var(--fg); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .4; }
.btn.danger { background: transparent; color: var(--fg); border: 1.5px solid var(--line); }
.fab { position: fixed; z-index: 25; right: max(20px, calc(env(safe-area-inset-right, 0px) + 20px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); height: 56px; padding: 0 22px; border-radius: 999px; background: var(--fg); color: var(--ink-inv); font-weight: 600; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
@media (min-width: 600px) { .fab { right: calc(50% - 280px + 16px); } }

/* Book detail */
.book-head { display: grid; grid-template-columns: 92px minmax(0,1fr); gap: 16px; margin-top: 18px; align-items: end; }
.book-head .cover { width: 92px; }
.book-head h1 { font-family: var(--font-display); font-weight: 800; font-size: 24px; letter-spacing: -0.02em; line-height: 1.25; margin: 0 0 4px; text-wrap: balance; }
.book-head .meta { color: var(--muted); font-size: 13.5px; }
.book-head .count { margin-top: 10px; font-size: 13px; font-variant-numeric: tabular-nums; }
.row-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }

/* Highlight cards */
.cards { display: grid; gap: 18px; }
.card { display: grid; gap: 10px; padding-bottom: 18px; border-bottom: 1px solid var(--line); text-align: left; width: 100%; min-width: 0; }
.card canvas { width: 100%; display: block; background: var(--soft); border: 1px solid var(--line); }
.card .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.card .meta b { color: var(--fg); font-weight: 600; }
.card .quote { font-family: var(--font-display); font-size: 17px; line-height: 1.65; font-weight: 600; letter-spacing: -0.01em; margin: 0; overflow-wrap: anywhere; }
.card .note { font-size: 14px; color: var(--muted); margin: 0; padding-left: 12px; border-left: 2px solid var(--fg); overflow-wrap: anywhere; }
.card .nomark { font-size: 12.5px; color: var(--muted); }
.card .reading { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.card .reading::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--muted); border-top-color: transparent; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.card.text-card .quote { font-size: 18px; }

.search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 999px; padding: 0 14px; height: 42px; margin-top: 16px; background: var(--soft); }
.search input { border: 0; background: transparent; outline: none; flex: 1; min-width: 0; font-size: 15px; }

/* Sheets */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; border-radius: 18px 18px 0 0; padding: 20px max(18px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 20px) max(18px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; max-height: 92%; overflow-y: auto; }
.sheet h3 { font-family: var(--font-display); font-size: 20px; margin: 0; }
.sheet p { margin: 0; color: var(--muted); font-size: 14px; }
.field { display: grid; gap: 6px; }
.field label { font-size: 12.5px; font-weight: 600; letter-spacing: .02em; }
.field input, .field textarea { border: 0; border-bottom: 1.5px solid var(--line); background: transparent; padding: 8px 0; font-size: 16px; outline: none; resize: none; border-radius: 0; }
.field input:focus, .field textarea:focus { border-bottom-color: var(--fg); }
.shot { display: grid; grid-template-columns: 84px minmax(0,1fr); gap: 14px; align-items: center; }
.shot .cover { width: 84px; }
.shot .hint { font-size: 13px; color: var(--muted); display: grid; gap: 8px; justify-items: start; }
.file-btn { position: relative; overflow: hidden; }
.fab.file-btn { position: fixed; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.sheet-actions { display: flex; gap: 10px; }
.sheet-actions .btn { flex: 1; }

/* Editor */
.editor { position: fixed; inset: 0; z-index: 35; background: var(--bg); overflow-y: auto; padding-bottom: env(safe-area-inset-bottom, 0px); }
.ed-inner { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: 28px; }
/* top bar (뒤로 · 삭제 · 저장) stays put while the page scrolls */
.ed-top { position: sticky; top: 0; z-index: 5; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  border-bottom: 1px solid var(--line); }
.ed-top .ttl { font-size: 13.5px; color: var(--muted); text-align: center; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.save-btn { height: 36px; padding: 0 16px; font-size: 14px; }
.stage { background: var(--soft); display: grid; place-items: center; min-height: 200px; overflow: hidden; touch-action: none; position: relative;
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); }
.paper { position: relative; touch-action: none; user-select: none; -webkit-user-select: none; max-width: 100%; transform-origin: 0 0; will-change: transform; }
.zoom-reset { position: absolute; right: 10px; bottom: 10px; z-index: 2; height: 32px; padding: 0 12px; border-radius: 999px; background: rgba(17,17,17,.78); color: #fff; font-size: 12.5px; font-weight: 600; }
.paper img { display: block; width: 100%; height: 100%; pointer-events: none; -webkit-user-drag: none; }
.paper canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.tools { display: flex; gap: 6px; padding-block: 12px; justify-content: space-between; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tool-group { display: flex; gap: 6px; }
.tool { height: 40px; min-width: 40px; padding: 0 12px; border-radius: 999px; border: 1.5px solid var(--line); display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 500; }
.tool[aria-pressed="true"] { background: var(--fg); color: var(--ink-inv); border-color: var(--fg); }
.tool:disabled { opacity: .35; }
.swatch-pen { width: 16px; height: 3px; background: currentColor; }
.swatch-mark { width: 16px; height: 9px; background: var(--mark); outline: 1px solid currentColor; outline-offset: -1px; }
.ed-fields { display: grid; gap: 16px; padding-top: 16px; }
.ed-fields .two { display: grid; grid-template-columns: 96px minmax(0,1fr); gap: 14px; }
.tip { font-size: 12.5px; color: var(--muted); padding-top: 10px; }

.auth { min-height: calc(100vh - 40px); display: grid; align-content: center; gap: 28px; padding-block: 40px; max-width: 360px; margin: 0 auto; }
.auth .brand { font-size: 40px; }

.auth form { display: grid; gap: 18px; }

.auth .fine { font-size: 12px; color: var(--muted); margin: 0; }
.acct { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.acct-link { font-size: 12.5px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.acct button { font-size: 12.5px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.migrate { margin-top: 14px; border: 1.5px solid var(--fg); padding: 12px 14px; display: grid; gap: 10px; font-size: 13.5px; }
.migrate .btn { height: 38px; font-size: 14px; justify-self: start; }
/* A/B test group B: short intro instead of the login screen */
.intro { min-height: calc(100vh - 40px); display: grid; align-content: center; gap: 26px; padding-block: 40px; max-width: 360px; margin: 0 auto; }
.intro .brand { font-size: 40px; }
.intro .lead { margin: -12px 0 0; color: var(--muted); font-size: 14.5px; line-height: 1.55; }
.intro-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; counter-reset: st; }
.intro-steps li { display: grid; grid-template-columns: 30px minmax(0,1fr); gap: 12px; align-items: start; counter-increment: st; }
.intro-steps li::before { content: counter(st); width: 30px; height: 30px; border-radius: 50%; background: var(--fg); color: var(--ink-inv); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.intro-steps b { display: block; font-size: 15.5px; }
.intro-steps span { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; line-height: 1.5; }
.intro .link-btn, .auth .link-btn { justify-self: center; font-size: 13px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.save-form { display: grid; gap: 14px; }
.save-form .err { color: var(--fg); font-size: 13px; font-weight: 600; min-height: 1.1em; margin: 0; }
.sheet .fine { font-size: 12px; }
.book-tabs { display: flex; gap: 20px; margin-top: 22px; border-bottom: 1px solid var(--line); }
.book-tabs .tab { padding-bottom: 8px; margin-bottom: -1px; }
.readers { font-size: 13px; color: var(--muted); margin: 16px 0 4px; }
.share-card { gap: 8px; }
.share-card .note-big { font-size: 17px; font-weight: 600; line-height: 1.6; margin: 0; overflow-wrap: anywhere; letter-spacing: -0.01em; }
.share-card .quote-sm { font-size: 13.5px; color: var(--muted); margin: 0; padding-left: 10px; border-left: 2px solid var(--line); overflow-wrap: anywhere; }
.share-card .src { font-size: 12px; color: var(--muted); margin: 0; }
.share-card .who { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.share-card .who b { color: var(--fg); font-weight: 600; }
.link-btn { font-size: 12.5px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.chip { font-size: 11px; font-weight: 600; border: 1px solid var(--fg); padding: 1px 7px; border-radius: 999px; color: var(--fg); }
.share-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.share-row span { display: grid; gap: 2px; min-width: 0; }
.share-row b { font-size: 14px; }
.share-row small { font-size: 12px; color: var(--muted); }
.switch-input { appearance: none; -webkit-appearance: none; flex: none; width: 46px; height: 28px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; transition: background .15s; margin: 0; }
.switch-input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--bg); transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }

.terms { display: grid; gap: 10px; font-size: 14px; color: var(--fg); padding-left: 18px; margin: 0; }
.title-btn { font: inherit; text-align: left; letter-spacing: inherit; }
.title-btn::after { content: "✎"; font-size: 14px; font-weight: 400; color: var(--muted); margin-left: 6px; }
button.cover { padding: 0; cursor: pointer; }
.book-head .count2 { margin-top: 2px; color: var(--muted); }
.cover-big { width: min(220px, 60%); margin: 0 auto; }
.ed-actions { display: flex; gap: 6px; }
.colors { gap: 10px; align-items: center; }
.color-dot { width: 30px; height: 30px; border-radius: 50%; background: var(--dot); border: 2px solid var(--bg); box-shadow: 0 0 0 1.5px var(--line); }
.color-dot[aria-checked="true"] { box-shadow: 0 0 0 2px var(--fg); }
.pick-tool .sw { width: 16px; border-radius: 2px; flex: none; }

.no-photo { margin: 0; padding: 28px 12px; text-align: center; font-size: 13px; color: var(--muted); background: var(--soft); border: 1px dashed var(--line); width: 100%; }

<body>
<div class="app" id="app"><div class="loading">서재를 여는 중…</div></div>
<div id="layer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(() => {
  "use strict";
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const appEl = $("#app"), layer = $("#layer");

  const S = { mode: "loading", books: [], pages: [], view: "library", tab: "books", bookId: null, q: "", loaded: { books: false, pages: false }, err: "" };
  let store = null;

  /* ---------- image helpers ---------- */
  function loadImg(src) {
    return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
  }
  const imgCache = new Map();
  function cachedImg(src) { if (!imgCache.has(src)) imgCache.set(src, loadImg(src)); return imgCache.get(src); }

  // small files: WebP (quality .7) where the browser can write it, otherwise JPEG
  async function encode(canvas, q = 0.7) {
    const webp = await new Promise(r => canvas.toBlob(r, "image/webp", q));
    if (webp && webp.type === "image/webp") return webp;
    return await new Promise(r => canvas.toBlob(r, "image/jpeg", Math.min(0.85, q + 0.1)));
  }
  async function shrink(file, max, opts = {}) {
    const url = URL.createObjectURL(file);
    try {
      const img = await loadImg(url);
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      const blob = opts.jpeg ? await new Promise(r => c.toBlob(r, "image/jpeg", 0.9)) : await encode(c, 0.7);
      return { blob, w, h };
    } finally { URL.revokeObjectURL(url); }
  }

  const blobToDataURL = (b) => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });

  /* ---------- stroke drawing (coords normalized 0..1 to image) ---------- */
  const MARK_COLORS = {
    y: { name: "노랑", ink: "rgba(255,214,0,.45)", css: "#ffd600" },
    g: { name: "초록", ink: "rgba(70,215,110,.40)", css: "#46d76e" },
    p: { name: "분홍", ink: "rgba(255,105,180,.38)", css: "#ff69b4" },
    b: { name: "하늘", ink: "rgba(70,165,255,.38)", css: "#46a5ff" },
    o: { name: "주황", ink: "rgba(255,145,40,.42)", css: "#ff9128" }
  };
  // pen: thin solid line (red by default)
  const PEN_COLORS = {
    r: { name: "빨강", css: "#e5383b" },
    k: { name: "검정", css: "#111111" },
    b: { name: "파랑", css: "#1f6feb" },
    g: { name: "초록", css: "#2a9d4b" },
    v: { name: "보라", css: "#8a4bd6" }
  };
  function drawStrokes(ctx, strokes, W, H, y0 = 0, ySpan = 1) {
    for (const s of strokes || []) {
      const p = s.p; if (!p || p.length < 4) continue;
      ctx.save();
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      if (s.t === "mark") { ctx.strokeStyle = (MARK_COLORS[s.c] || MARK_COLORS.y).ink; ctx.lineWidth = Math.max(8, W * 0.032); ctx.globalCompositeOperation = "multiply"; }
      else { ctx.strokeStyle = (PEN_COLORS[s.c] || PEN_COLORS.k).css; ctx.lineWidth = Math.max(2.5, W * 0.006); }
      ctx.beginPath();
      for (let i = 0; i < p.length; i += 2) {
        const x = p[i] * W, y = ((p[i + 1] - y0) / ySpan) * H;
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke(); ctx.restore();
    }
  }
  function cropRange(strokes) {
    let lo = 1, hi = 0;
    for (const s of strokes || []) for (let i = 1; i < s.p.length; i += 2) { lo = Math.min(lo, s.p[i]); hi = Math.max(hi, s.p[i]); }
    if (hi < lo) return [0, 1];
    lo = Math.max(0, lo - 0.07); hi = Math.min(1, hi + 0.07);
    if (hi - lo < 0.16) { const m = (lo + hi) / 2; lo = Math.max(0, m - 0.08); hi = Math.min(1, m + 0.08); }
    return [lo, hi];
  }
  async function paintCrop(canvas, page) {
    try {
      const src = await resolveSrc(page.imageId, page.imageUrl);
      if (!src) throw new Error("no photo");
      const img = await cachedImg(src);
      const [a, b] = cropRange(page.strokes);
      const cssW = canvas.clientWidth || 320, dpr = Math.min(2, window.devicePixelRatio || 1);
      const W = Math.round(cssW * dpr), H = Math.round(W * (img.naturalHeight * (b - a)) / img.naturalWidth);
      canvas.width = W; canvas.height = H; canvas.style.aspectRatio = W + " / " + H;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, a * img.naturalHeight, img.naturalWidth, (b - a) * img.naturalHeight, 0, 0, W, H);
      drawStrokes(ctx, page.strokes, W, H, a, b - a);
    } catch {
      const n = document.createElement("p"); n.className = "no-photo"; n.textContent = "사진 없음";
      canvas.replaceWith(n);
    }
  }

  /* ---------- stores ---------- */
  function idbStore() {
    const DBN = "underline", VER = 1;
    const opened = new Promise((res, rej) => {
      const r = indexedDB.open(DBN, VER);
      r.onupgradeneeded = () => { const d = r.result; ["books", "pages", "images"].forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, { keyPath: "id" }); }); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    const tx = async (name, mode, fn) => {
      const d = await opened;
      return new Promise((res, rej) => {
        const t = d.transaction(name, mode), st = t.objectStore(name); let out;
        Promise.resolve(fn(st)).then(v => { out = v; });
        t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || { code: "quota_exceeded" });
      });
    };
    const req = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    const all = (name) => tx(name, "readonly", st => req(st.getAll()));
    let cb = () => {};
    const emit = async () => { cb("books", await all("books")); cb("pages", await all("pages")); };
    const nid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
    const urls = new Map();
    return {
      remote: false,
      async dump() { return { books: await all("books"), pages: await all("pages") }; },
      async blob(key) { const row = await tx("images", "readonly", st => req(st.get(key))); return row ? row.blob : null; },
      async clear() { for (const n of ["books", "pages", "images"]) await tx(n, "readwrite", st => st.clear()); },
      subscribe(f, onErr) { cb = f; emit().catch(e => onErr && onErr({ code: "storage" })); },
      async upload(blob) {
        const key = nid();
        await tx("images", "readwrite", st => st.put({ id: key, blob }));
        const url = URL.createObjectURL(blob); urls.set(key, url);
        return { id: "idb:" + key, url };
      },
      async readImage(key) {
        if (urls.has(key)) return urls.get(key);
        const row = await tx("images", "readonly", st => req(st.get(key)));
        if (!row) throw { code: "missing" };
        const url = URL.createObjectURL(row.blob); urls.set(key, url); return url;
      },
      async deleteImage(id) {
        if (!id || !id.startsWith("idb:")) return;
        const key = id.slice(4);
        await tx("images", "readwrite", st => st.delete(key));
        if (urls.has(key)) { URL.revokeObjectURL(urls.get(key)); urls.delete(key); }
      },
      async addBook(d) { const id = nid(); await tx("books", "readwrite", st => st.put({ id, ...d })); await emit(); return id; },
      async updateBook(id, d) {
        const cur = await tx("books", "readonly", st => req(st.get(id)));
        if (cur) await tx("books", "readwrite", st => st.put({ ...cur, ...d })); await emit();
      },
      async deleteBook(id) {
        for (const p of S.pages.filter(p => p.bookId === id)) await this.deletePage(p.id, true);
        const b = S.books.find(b => b.id === id); if (b) await this.deleteImage(b.coverId);
        await tx("books", "readwrite", st => st.delete(id)); await emit();
      },
      async addPage(d) { const id = nid(); await tx("pages", "readwrite", st => st.put({ id, ...d })); await emit(); return id; },
      async updatePage(id, d) {
        const cur = await tx("pages", "readonly", st => req(st.get(id)));
        if (cur) await tx("pages", "readwrite", st => st.put({ ...cur, ...d })); await emit();
      },
      async deletePage(id, quiet) {
        const p = S.pages.find(p => p.id === id); if (p) await this.deleteImage(p.imageId);
        await tx("pages", "readwrite", st => st.delete(id)); if (!quiet) await emit();
      }
    };
  }

  /* ---------- analytics (Google Analytics 4) ---------- */
  // Put the measurement ID (G-XXXXXXXXXX) here. Empty = nothing is sent.
  const GA_ID = "G-CRVC3WHV9W";
  // A/B test of the first screen: A = login first (as before), B = short intro, use without an account, sign up to save.
  // Fixed per phone; ?ab=A or ?ab=B forces a group for testing.
  const AB_KEY = "ul_ab_onboard";
  const AB = (() => {
    let g = "";
    try {
      const q = (new URLSearchParams(location.search).get("ab") || "").toUpperCase();
      if (q === "A" || q === "B") { g = q; localStorage.setItem(AB_KEY, g); }
      else g = localStorage.getItem(AB_KEY) || "";
      if (g !== "A" && g !== "B") { g = Math.random() < 0.5 ? "A" : "B"; localStorage.setItem(AB_KEY, g); }
    } catch { if (g !== "A" && g !== "B") g = "A"; }
    return g;
  })();
  const ga = (() => {
    if (!GA_ID) return { event() {}, screen() {}, user() {} };
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { window.dataLayer.push(arguments); };
    gtag("js", new Date());
    gtag("config", GA_ID, { send_page_view: false });
    gtag("set", "user_properties", { ab_group: AB });
    const sc = document.createElement("script"); sc.async = true;
    sc.src = "https://www.googletagmanager.com/gtag/js?id=" + GA_ID; document.head.appendChild(sc);
    let last = "";
    return {
      event(name, params) { try { gtag("event", name, { ab_group: AB, ...(params || {}) }); } catch {} },
      // each screen counts as a page view: 로그인, 책장, 밑줄 모아보기, 책, 같이 읽은 사람들, 밑줄 화면
      screen(key, title) {
        if (key === last) return; last = key;
        try { gtag("event", "page_view", { ab_group: AB, page_title: title, page_location: location.origin + location.pathname + "#" + key }); } catch {}
      },
      // an opaque account id only (never the name), so one person on several devices counts once
      user(id) { try { gtag("set", { user_id: id }); } catch {} }
    };
  })();

  /* ---------- session recordings & heatmaps (Microsoft Clarity) ---------- */
  // Put the Clarity project ID here. Empty = nothing is loaded.
  // Typed text, names, memos and page photos are masked (data-clarity-mask) so they never appear in recordings.
  const CLARITY_ID = "";
  const clarity = (() => {
    if (!CLARITY_ID) return () => {};
    (function (c, l, a, r, i, t, y) {
      c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments); };
      t = l.createElement(r); t.async = 1; t.src = "https://www.clarity.ms/tag/" + i;
      y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
    })(window, document, "clarity", "script", CLARITY_ID);
    window.clarity("set", "ab_group", AB);
    return (...args) => { try { window.clarity(...args); } catch {} };
  })();

  /* ---------- account (Supabase) ---------- */
  const SUPABASE_URL = "https://ftkjrnjstfpunjixnuqc.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ0a2pybmpzdGZwdW5qaXhudXFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQzODM0MjUsImV4cCI6MjEwOTk1OTQyNX0.UhjmfjquSKJla9oRVBwInredKrlYka-Jo0bh9_BCiEw";
  const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } }) : null;
  // a name becomes a hidden e-mail address so any language works as a login name
  const nameToEmail = (name) => "u" + Array.from(new TextEncoder().encode(name.trim().toLowerCase())).map(b => b.toString(16).padStart(2, "0")).join("") + "@users.underline-app.com";

  // photos downloaded once stay on the phone (IndexedDB), so they are not fetched again
  const photoCache = (() => {
    let dbp = null;
    const open = () => dbp || (dbp = new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error("no idb"));
      const r = indexedDB.open("underline-cache", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("img");
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    }));
    const run = (mode, fn) => open().then(d => new Promise((res, rej) => {
      const t = d.transaction("img", mode), q = fn(t.objectStore("img"));

      get: (k) => run("readonly", st => st.get(k)).catch(() => null),
      put: (k, blob) => run("readwrite", st => st.put(blob, k)).catch(() => {}),
      del: (k) => run("readwrite", st => st.delete(k)).catch(() => {})

  })();

  function cloudStore(uid) {

    const path = (id) => (id && id.startsWith("sb:")) ? id.slice(3) : null;
    const bookOut = (d) => { const o = {}; if ("title" in d) o.title = d.title; if ("author" in d) o.author = d.author; if ("coverId" in d) o.cover_path = path(d.coverId); if ("browseHidden" in d) o.browse_hidden = d.browseHidden; if ("ocr" in d) o.ocr = d.ocr; if ("createdAt" in d) o.created_at = d.createdAt; return o; };
    const pageOut = (d) => {
      const o = {}, m = { bookId: "book_id", w: "w", h: "h", strokes: "strokes", pageNo: "page_no", quote: "quote", note: "note", tags: "tags", shared: "shared", ocr: "ocr", createdAt: "created_at", updatedAt: "updated_at" };

      if ("imageId" in d) o.image_path = path(d.imageId);

      const [b, p] = await Promise.all([sb.from("books").select("*"), sb.from("pages").select("*")]);

    };

      remote: true,
      subscribe(f, onErr) { cb = f; emit().catch(e => onErr && onErr(e)); },
      async upload(blob, kind) {
        const type = blob.type || "image/jpeg", ext = type === "image/webp" ? ".webp" : ".jpg";
        const pre = kind === "page" ? "p2-" : kind === "crop" ? "p2c-" : kind === "cover" ? "c2-" : kind === "share" ? "s2-" : "";

      },
      async deleteImage(id) { const k = path(id); if (k) { photoCache.del(k); try { await sb.storage.from("photos").remove([k]); } catch {} } },
      async addBook(d) { const r = must(await sb.from("books").insert(bookOut(d)).select("id").single()); await emit(); return r.id; },
      async updateBook(id, d) { must(await sb.from("books").update(bookOut(d)).eq("id", id)); await emit(); },
      async deleteBook(id) {
        for (const p of S.pages.filter(p => p.bookId === id)) { await this.deleteImage(p.imageId); if (p.sharePath) await this.deleteImage(p.sharePath); }
        const b = S.books.find(b => b.id === id); if (b) await this.deleteImage(b.coverId);
        must(await sb.from("books").delete().eq("id", id)); await emit();

      async addPage(d) { const r = must(await sb.from("pages").insert(pageOut(d)).select("id").single()); await emit(); return r.id; },
      async updatePage(id, d) { must(await sb.from("pages").update(pageOut(d)).eq("id", id)); await emit(); },
      async deletePage(id) {
        const p = S.pages.find(p => p.id === id); if (p) { await this.deleteImage(p.imageId); if (p.sharePath) await this.deleteImage(p.sharePath); }

  async function loadShared(bookId) {

  function trackScreen() {

    if (S.mode !== "remote" && S.mode !== "local") return;
    if (S.view === "book") return S.bookTab === "shared" ? ga.screen("book-shared", "같이 읽은 사람들") : ga.screen("book", "책 화면");
    if (S.view === "browse-book") return ga.screen("browse-book", "둘러보기 책");
    return S.tab === "marks" ? ga.screen("marks", "밑줄 모아보기") : S.tab === "browse" ? ga.screen("browse", "둘러보기") : ga.screen("shelf", "책장");
  }
  function render() {
    setTimeout(trackScreen, 0);
    const scrollY = window.scrollY;
    const qFocused = document.activeElement && document.activeElement.id === "q";

    if (S.mode === "loading") { appEl.innerHTML = `<div class="loading">서재를 여는 중…</div>`; return; }

    if (S.mode === "remote" && S.loaded.books && S.loaded.pages && !S.books.length && !S.onbOpen && !onbSeen() && !ED.el) setTimeout(() => showOnboarding(false), 0);
    appEl.innerHTML = S.view === "book" ? viewBook() : S.view === "browse-book" ? viewBrowseBook() : viewLibrary();
    hydrateImgs(appEl);
    appEl.querySelectorAll("canvas[data-crop]").forEach(c => { const p = S.pages.find(p => p.id === c.dataset.crop) || (S.ext && S.ext[c.dataset.crop]); if (p) paintCrop(c, p); });
    if (qFocused) { const q = $("#q"); if (q) { q.focus(); try { q.setSelectionRange(caret, caret); } catch {} } }

      toast("저장했어요.");
      const nStrokes = ED.strokes.length;
      const after = (strokesChanged && nStrokes) ? cropToMarks(id) : Promise.resolve();
      after.then(() => {
        if (wantShare === null) return;
        const cur = S.pages.find(x => x.id === id); if (!cur) return;
        if (wantShare && nStrokes && (!cur.shared || !cur.sharePath || strokesChanged)) setShare(id, true, true);
        else if ((!wantShare || !nStrokes) && cur.shared) setShare(id, false, true);
      });
    }
    catch (e) { toast(errMsg(e)); } finally { busy(false); }
  }

  // after saving, keep only the band of the page around the highlights (full width),
  // move the strokes onto the smaller photo, and delete the full page photo
  async function cropToMarks(id) {
    try {
      const p = S.pages.find(p => p.id === id);
      if (!p || !store.remote || !p.imageId || !/\/p2c?-/.test(p.imageId) || !(p.strokes || []).length) return;
      if (ED.el && ED.id === id) return; // being edited again; the next save will do it
      const img = await loadImg(await resolveSrc(p.imageId, p.imageUrl));
      const W = img.naturalWidth, H = img.naturalHeight;
      let lo = 1, hi = 0;
      for (const st of p.strokes) for (let i = 1; i < st.p.length; i += 2) { lo = Math.min(lo, st.p[i]); hi = Math.max(hi, st.p[i]); }
      const lh = Math.max(14, W * 0.032);
      const top = Math.max(0, Math.floor(lo * H - lh * 1.8)), bot = Math.min(H, Math.ceil(hi * H + lh * 1.8));
      if (bot - top > H * 0.85) return; // nothing much to save
      const c = document.createElement("canvas"); c.width = W; c.height = bot - top;
      c.getContext("2d").drawImage(img, 0, top, W, bot - top, 0, 0, W, bot - top);
      const blob = await encode(c, 0.7);
      const up = await store.upload(blob, "crop");
      const span = bot - top, r4 = (v) => Math.round(v * 10000) / 10000;
      const strokes = p.strokes.map(st => ({ ...st, p: st.p.map((v, i) => i % 2 ? r4((v * H - top) / span) : v) }));
      const old = p.imageId;
      await store.updatePage(id, { imageId: up.id, w: W, h: span, strokes });
      await store.deleteImage(old);
    } catch (e) { console.warn("crop failed", e); }
  }

  // what others see when a highlight is shared: just the highlighted part, with the highlighter drawn in
  async function makeShareStrip(p) {
    const img = await loadImg(await resolveSrc(p.imageId, p.imageUrl));
    const W = img.naturalWidth, H = img.naturalHeight;
    let x0 = W, x1 = 0, y0 = H, y1 = 0;
    for (const st of p.strokes) for (let i = 0; i < st.p.length; i += 2) {
      x0 = Math.min(x0, st.p[i] * W); x1 = Math.max(x1, st.p[i] * W); y0 = Math.min(y0, st.p[i + 1] * H); y1 = Math.max(y1, st.p[i + 1] * H);
    }
    const lh = Math.max(14, W * 0.032);
    x0 = Math.max(0, Math.floor(x0 - lh * 0.6)); x1 = Math.min(W, Math.ceil(x1 + lh * 0.6));
    y0 = Math.max(0, Math.floor(y0 - lh * 0.9)); y1 = Math.min(H, Math.ceil(y1 + lh * 0.9));
    const c = document.createElement("canvas"); c.width = Math.max(1, x1 - x0); c.height = Math.max(1, y1 - y0);
    const ctx = c.getContext("2d");
    ctx.drawImage(img, x0, y0, c.width, c.height, 0, 0, c.width, c.height);
    ctx.translate(-x0, -y0); drawStrokes(ctx, p.strokes, W, H);
    return await store.upload(await encode(c, 0.75), "share");
  }

  // a name that exists signs in; a new name is created with this password
  async function signInOrUp(name, pw, from) {
    const email = nameToEmail(name);

    if (r.error && /invalid login|credentials/i.test(r.error.message || "")) {

      if (up.error && /already registered|already exists/i.test(up.error.message || "")) throw { message: "wrong password" };

    } else if (!r.error) ga.event("login", { method: "name", from });

  // bring in the backup file made by the earlier Claude-link version
  async function importBackup(file) {
    let data;

    if (!data || data.app !== "underline" || !Array.isArray(data.books)) { toast("_밑줄. 백업 파일이 아니에요."); return; }
    const images = data.images || {}, pages = Array.isArray(data.pages) ? data.pages : [];
    const toBlob = async (key) => { const d = key && images[key]; if (!d) return null; return await (await fetch(d)).blob(); };
    const have = new Set(S.books.map(b => (b.title || "") + "|" + b.createdAt));
    const todo = data.books.filter(b => !have.has((b.title || "") + "|" + (b.createdAt || 0)));
    if (!todo.length) { toast("이미 모두 가져온 기록이에요."); return; }
    let done = 0, failed = 0;
    try {
      for (const b of todo) {
        busy(true, `가져오는 중… ${done + 1}/${todo.length}권`);
        let coverId = "";
        try { const bl = await toBlob(b.photo); if (bl) coverId = (await store.upload(bl)).id; } catch { failed++; }
        const newId = await store.addBook({ title: b.title || "", coverId, ocr: b.title ? "done" : "", createdAt: b.createdAt || Date.now() });
        for (const p of pages.filter(p => p.bookId === b.id)) {
          let imageId = "";
          try { const bl = await toBlob(p.photo); if (bl) imageId = (await store.upload(bl)).id; } catch { failed++; }
          await store.addPage({ bookId: newId, imageId, w: p.w || null, h: p.h || null, strokes: p.strokes || [], pageNo: p.pageNo || "", quote: p.quote || "", note: p.note || "", ocr: p.quote ? "done" : "", createdAt: p.createdAt || Date.now(), updatedAt: p.updatedAt || null });
        }
        done++;
      }
      toast(`책 ${done}권을 가져왔어요.` + (failed ? ` 사진 ${failed}장은 가져오지 못했어요.` : ""));
    } catch (e) { console.warn("import failed", e); toast(`${done}권까지 가져왔어요. ` + errMsg(e)); }
    finally { busy(false); }
  }
  async function countLocal() {
    try { if (!window.indexedDB) return 0; const { books } = await idbStore().dump(); return books.length; } catch { return 0; }
  }
  function enter(user, opts = {}) {
    ga.user(user.id); clarity("identify", user.id); // the opaque account id only, never the name
    S.user = (user.user_metadata && user.user_metadata.username) || "";
    if (sb && S.user) sb.from("profiles").upsert({ id: user.id, username: S.user, updated_at: new Date().toISOString() })
      // which first screen this person saw (separate call, so a missing column never blocks the name)
      .then(() => { if (opts.isNew) return sb.from("profiles").update({ ab_group: AB }).eq("id", user.id); })
      .then(() => {}, () => {});
    S.mode = "loading"; S.loaded = { books: false, pages: false }; render();
    start(cloudStore(user.id), "remote");
    if (opts.migrate) migrateLocal();
    else countLocal().then(n => { S.localCount = n; if (n && !ED.el) render(); });
  }
  const introSeen = (set) => { try { if (set) localStorage.setItem("ul_intro_seen", "1"); return localStorage.getItem("ul_intro_seen") === "1"; } catch { return !!set; } };
  function showLogin() { S.mode = "auth"; render(); ga.event("login_view"); }
  function startGuest() { S.loaded = { books: false, pages: false }; start(idbStore(), "local"); }
  async function boot() {
    if (!sb) { S.mode = "local"; S.err = "서버에 연결하지 못했어요. 인터넷 연결을 확인하고 다시 열어 주세요."; S.loaded.books = true; render(); return; }
    const { data } = await sb.auth.getSession();
    if (data && data.session) return enter(data.session.user);
    if (AB === "B") {
      // already started on this phone (or has books here): straight to the shelf; otherwise the short intro
      if (introSeen() || await countLocal()) return startGuest();
      S.mode = "intro"; render(); ga.event("onboard_view"); return;
    }
    showLogin();
  }
  boot();
})();
</script>
</body>
</html>
