<html lang="ko">

<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); color-scheme: light; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: one narrow phone column, paper-white sheet, ink-black type; photos are the only color. */
:root {
  --bg: #ffffff;
  --fg: #111111;
  --muted: #6e6e6e;
  --line: #e6e6e6;
  --soft: #f4f4f4;
  --ink-inv: #ffffff;
  --mark: rgba(255, 214, 0, .45);
  --font-display: "Pretendard Variable", "Pretendard", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-body: "Pretendard Variable", "Pretendard", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg:#0d0d0d; --fg:#f2f2f2; --muted:#9a9a9a; --line:#262626; --soft:#181818; --ink-inv:#0d0d0d; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg:#0d0d0d; --fg:#f2f2f2; --muted:#9a9a9a; --line:#262626; --soft:#181818; --ink-inv:#0d0d0d; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, textarea { font: inherit; color: var(--fg); }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

.app { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: 120px; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-block: 14px 10px; border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: -0.04em; line-height: 1.2; }
.tabs { display: flex; gap: 20px; margin-top: 10px; }
.tab { font-size: 14px; font-weight: 500; color: var(--muted); padding-block: 4px; border-bottom: 2px solid transparent; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--fg); }
.back { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
.icon-btn { width: 36px; height: 36px; display: inline-grid; place-items: center; border-radius: 50%; }
.icon-btn:active { background: var(--soft); }

.notice { margin-top: 14px; font-size: 12.5px; color: var(--muted); border: 1px dashed var(--line); padding: 10px 12px; }

/* Library grid */
.section-label { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 22px 0 12px; display: flex; justify-content: space-between; }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px 10px; }
@media (min-width: 520px) { .grid { gap: 22px 14px; } }
.book { text-align: left; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.cover { aspect-ratio: 2 / 3; width: 100%; max-width: 100%; background: var(--soft); border: 1px solid var(--line); overflow: hidden; display: grid; place-items: center; position: relative; }
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cover .ph { font-family: var(--font-display); font-weight: 700; font-size: 11px; padding: 6px; text-align: center; line-height: 1.35; text-wrap: balance; }
.cover .badge { position: absolute; right: 6px; bottom: 6px; background: var(--fg); color: var(--ink-inv); font-size: 11px; font-weight: 600; padding: 2px 7px; font-variant-numeric: tabular-nums; }
.book-title { font-weight: 600; font-size: 12px; line-height: 1.3; letter-spacing: -0.01em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.book-link { text-align: left; display: grid; gap: 2px; min-width: 0; }
.book-count { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.add-chip { position: absolute; right: 5px; bottom: 5px; width: 30px; height: 30px; border-radius: 50%; background: var(--fg); color: var(--ink-inv); pointer-events: none; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
.add-chip { overflow: hidden; }
.add-chip svg { position: absolute; inset: 0; width: 100%; height: 100%; }

/* Empty state */
.empty { text-align: center; padding: 56px 12px 24px; display: grid; gap: 14px; justify-items: center; }
.empty h2 { font-family: var(--font-display); font-size: 22px; font-weight: 700; margin: 0; text-wrap: balance; }
.empty p { color: var(--muted); margin: 0; max-width: 30ch; }
.steps { display: grid; gap: 10px; text-align: left; margin-top: 8px; width: 100%; max-width: 320px; }
.steps li { list-style: none; display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; font-size: 14px; }
.steps li b { width: 22px; height: 22px; display: grid; place-items: center; border: 1.5px solid var(--fg); border-radius: 50%; font-size: 12px; }
.steps ol { padding: 0; margin: 0; display: grid; gap: 10px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 20px; background: var(--fg); color: var(--ink-inv); font-weight: 600; font-size: 15px; border-radius: 999px; }
.btn.ghost { background: transparent; color: var(--fg); border: 1.5px solid var(--fg); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .4; }
.btn.danger { background: transparent; color: var(--fg); border: 1.5px solid var(--line); }
.fab { position: fixed; z-index: 25; right: max(20px, calc(env(safe-area-inset-right, 0px) + 20px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); height: 56px; padding: 0 22px; border-radius: 999px; background: var(--fg); color: var(--ink-inv); font-weight: 600; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
@media (min-width: 600px) { .fab { right: calc(50% - 280px + 16px); } }

/* Book detail */
.book-head { display: grid; grid-template-columns: 92px minmax(0,1fr); gap: 16px; margin-top: 18px; align-items: end; }
.book-head .cover { width: 92px; }
.book-head h1 { font-family: var(--font-display); font-weight: 800; font-size: 24px; letter-spacing: -0.02em; line-height: 1.25; margin: 0 0 4px; text-wrap: balance; }
.book-head .meta { color: var(--muted); font-size: 13.5px; }
.book-head .count { margin-top: 10px; font-size: 13px; font-variant-numeric: tabular-nums; }
.row-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }

/* Highlight cards */
.cards { display: grid; gap: 18px; }
.card { display: grid; gap: 10px; padding-bottom: 18px; border-bottom: 1px solid var(--line); text-align: left; width: 100%; min-width: 0; }
.card canvas { width: 100%; display: block; background: var(--soft); border: 1px solid var(--line); }
.card .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.card .meta b { color: var(--fg); font-weight: 600; }
.card .quote { font-family: var(--font-display); font-size: 17px; line-height: 1.65; font-weight: 600; letter-spacing: -0.01em; margin: 0; overflow-wrap: anywhere; }
.card .note { font-size: 14px; color: var(--muted); margin: 0; padding-left: 12px; border-left: 2px solid var(--fg); overflow-wrap: anywhere; }
.card .nomark { font-size: 12.5px; color: var(--muted); }
.card .reading { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.card .reading::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--muted); border-top-color: transparent; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.card.text-card .quote { font-size: 18px; }

.search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 999px; padding: 0 14px; height: 42px; margin-top: 16px; background: var(--soft); }
.search input { border: 0; background: transparent; outline: none; flex: 1; min-width: 0; font-size: 15px; }

/* Sheets */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; border-radius: 18px 18px 0 0; padding: 20px max(18px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 20px) max(18px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; max-height: 92%; overflow-y: auto; }
.sheet h3 { font-family: var(--font-display); font-size: 20px; margin: 0; }
.sheet p { margin: 0; color: var(--muted); font-size: 14px; }
.field { display: grid; gap: 6px; }
.field label { font-size: 12.5px; font-weight: 600; letter-spacing: .02em; }
.field input, .field textarea { border: 0; border-bottom: 1.5px solid var(--line); background: transparent; padding: 8px 0; font-size: 16px; outline: none; resize: none; border-radius: 0; }
.field input:focus, .field textarea:focus { border-bottom-color: var(--fg); }
.shot { display: grid; grid-template-columns: 84px minmax(0,1fr); gap: 14px; align-items: center; }
.shot .cover { width: 84px; }
.shot .hint { font-size: 13px; color: var(--muted); display: grid; gap: 8px; justify-items: start; }
.file-btn { position: relative; overflow: hidden; }
.fab.file-btn { position: fixed; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.sheet-actions { display: flex; gap: 10px; }
.sheet-actions .btn { flex: 1; }

/* Editor */
.editor { position: fixed; inset: 0; z-index: 35; background: var(--bg); overflow-y: auto; padding-bottom: env(safe-area-inset-bottom, 0px); }
.ed-inner { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: 28px; }
/* top bar (뒤로 · 삭제 · 저장) stays put while the page scrolls */
.ed-top { position: sticky; top: 0; z-index: 5; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  border-bottom: 1px solid var(--line); }
.ed-top .ttl { font-size: 13.5px; color: var(--muted); text-align: center; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.save-btn { height: 36px; padding: 0 16px; font-size: 14px; }
.stage { background: var(--soft); display: grid; place-items: center; padding: 10px 0; min-height: 200px; }
.paper { position: relative; touch-action: none; user-select: none; -webkit-user-select: none; max-width: 100%; }
.paper img { display: block; width: 100%; height: 100%; pointer-events: none; -webkit-user-drag: none; }
.paper canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.tools { display: flex; gap: 6px; padding-block: 12px; justify-content: space-between; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tool-group { display: flex; gap: 6px; }
.tool { height: 40px; min-width: 40px; padding: 0 12px; border-radius: 999px; border: 1.5px solid var(--line); display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 500; }
.tool[aria-pressed="true"] { background: var(--fg); color: var(--ink-inv); border-color: var(--fg); }
.tool:disabled { opacity: .35; }
.swatch-pen { width: 16px; height: 3px; background: currentColor; }
.swatch-mark { width: 16px; height: 9px; background: var(--mark); outline: 1px solid currentColor; outline-offset: -1px; }
.ed-fields { display: grid; gap: 16px; padding-top: 16px; }
.ed-fields .two { display: grid; grid-template-columns: 96px minmax(0,1fr); gap: 14px; }
.tip { font-size: 12.5px; color: var(--muted); padding-top: 10px; }

.auth { min-height: calc(100vh - 40px); display: grid; align-content: center; gap: 28px; padding-block: 40px; max-width: 360px; margin: 0 auto; }
.auth .brand { font-size: 40px; }
.auth p.lead { margin: -16px 0 0; color: var(--muted); font-size: 14px; }
.auth form { display: grid; gap: 18px; }
.auth .switch { display: flex; gap: 20px; }
.auth .err { color: var(--fg); font-size: 13.5px; font-weight: 600; min-height: 1.2em; margin: 0; }
.auth .fine { font-size: 12px; color: var(--muted); margin: 0; }
.acct { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.acct-link { font-size: 12.5px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.acct button { font-size: 12.5px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.migrate { margin-top: 14px; border: 1.5px solid var(--fg); padding: 12px 14px; display: grid; gap: 10px; font-size: 13.5px; }
.migrate .btn { height: 38px; font-size: 14px; justify-self: start; }
.book-tabs { display: flex; gap: 20px; margin-top: 22px; border-bottom: 1px solid var(--line); }
.book-tabs .tab { padding-bottom: 8px; margin-bottom: -1px; }
.readers { font-size: 13px; color: var(--muted); margin: 16px 0 4px; }
.share-card { gap: 8px; }
.share-card .note-big { font-size: 17px; font-weight: 600; line-height: 1.6; margin: 0; overflow-wrap: anywhere; letter-spacing: -0.01em; }
.share-card .quote-sm { font-size: 13.5px; color: var(--muted); margin: 0; padding-left: 10px; border-left: 2px solid var(--line); overflow-wrap: anywhere; }
.share-card .src { font-size: 12px; color: var(--muted); margin: 0; }
.share-card .who { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.share-card .who b { color: var(--fg); font-weight: 600; }
.link-btn { font-size: 12.5px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.chip { font-size: 11px; font-weight: 600; border: 1px solid var(--fg); padding: 1px 7px; border-radius: 999px; color: var(--fg); }
.share-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.share-row span { display: grid; gap: 2px; min-width: 0; }
.share-row b { font-size: 14px; }
.share-row small { font-size: 12px; color: var(--muted); }
.switch-input { appearance: none; -webkit-appearance: none; flex: none; width: 46px; height: 28px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; transition: background .15s; margin: 0; }
.switch-input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--bg); transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.switch-input:checked { background: var(--fg); }
.switch-input:checked::after { transform: translateX(18px); }
.switch-input:disabled { opacity: .4; cursor: not-allowed; }
.terms { display: grid; gap: 10px; font-size: 14px; color: var(--fg); padding-left: 18px; margin: 0; }
.title-btn { font: inherit; text-align: left; letter-spacing: inherit; }
.title-btn::after { content: "✎"; font-size: 14px; font-weight: 400; color: var(--muted); margin-left: 6px; }
button.cover { padding: 0; cursor: pointer; }
.book-head .count2 { margin-top: 2px; color: var(--muted); }
.cover-big { width: min(220px, 60%); margin: 0 auto; }
.ed-actions { display: flex; gap: 6px; }
.colors { gap: 10px; align-items: center; }
.color-dot { width: 30px; height: 30px; border-radius: 50%; background: var(--dot); border: 2px solid var(--bg); box-shadow: 0 0 0 1.5px var(--line); }
.color-dot[aria-checked="true"] { box-shadow: 0 0 0 2px var(--fg); }
.no-photo { margin: 0; padding: 28px 12px; text-align: center; font-size: 13px; color: var(--muted); background: var(--soft); border: 1px dashed var(--line); width: 100%; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 92px); background: var(--fg); color: var(--ink-inv); padding: 10px 16px; border-radius: 999px; font-size: 13.5px; z-index: 60; max-width: calc(100% - 32px); text-align: center; }
.loading { text-align: center; color: var(--muted); padding: 60px 0; font-size: 14px; }
.busy { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.35); display: grid; place-items: center; }
.busy span { background: var(--bg); color: var(--fg); padding: 14px 20px; border-radius: 12px; font-size: 14px; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .22s ease-out; } @keyframes up { from { transform: translateY(24px); opacity: .6; } } }
</style>

<body>
<div class="app" id="app"><div class="loading">서재를 여는 중…</div></div>
<div id="layer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(() => {
  "use strict";
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const appEl = $("#app"), layer = $("#layer");

  const S = { mode: "loading", books: [], pages: [], view: "library", tab: "books", bookId: null, q: "", loaded: { books: false, pages: false }, err: "" };
  let store = null;

  /* ---------- image helpers ---------- */
  function loadImg(src) {
    return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
  }
  const imgCache = new Map();
  function cachedImg(src) { if (!imgCache.has(src)) imgCache.set(src, loadImg(src)); return imgCache.get(src); }

  // small files: WebP (quality .7) where the browser can write it, otherwise JPEG
  async function encode(canvas, q = 0.7) {
    const webp = await new Promise(r => canvas.toBlob(r, "image/webp", q));
    if (webp && webp.type === "image/webp") return webp;
    return await new Promise(r => canvas.toBlob(r, "image/jpeg", Math.min(0.85, q + 0.1)));
  }
  async function shrink(file, max, opts = {}) {
    const url = URL.createObjectURL(file);
    try {
      const img = await loadImg(url);
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      const blob = opts.jpeg ? await new Promise(r => c.toBlob(r, "image/jpeg", 0.9)) : await encode(c, 0.7);
      return { blob, w, h };
    } finally { URL.revokeObjectURL(url); }
  }

  const blobToDataURL = (b) => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });

  /* ---------- stroke drawing (coords normalized 0..1 to image) ---------- */
  const MARK_COLORS = {
    y: { name: "노랑", ink: "rgba(255,214,0,.45)", css: "#ffd600" },
    g: { name: "초록", ink: "rgba(70,215,110,.40)", css: "#46d76e" },
    p: { name: "분홍", ink: "rgba(255,105,180,.38)", css: "#ff69b4" },
    b: { name: "하늘", ink: "rgba(70,165,255,.38)", css: "#46a5ff" },
    o: { name: "주황", ink: "rgba(255,145,40,.42)", css: "#ff9128" }
  };
  function drawStrokes(ctx, strokes, W, H, y0 = 0, ySpan = 1) {
    for (const s of strokes || []) {
      const p = s.p; if (!p || p.length < 4) continue;
      ctx.save();
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      if (s.t === "mark") { ctx.strokeStyle = (MARK_COLORS[s.c] || MARK_COLORS.y).ink; ctx.lineWidth = Math.max(8, W * 0.032); ctx.globalCompositeOperation = "multiply"; }
      else { ctx.strokeStyle = "#111"; ctx.lineWidth = Math.max(2, W * 0.0045); }
      ctx.beginPath();
      for (let i = 0; i < p.length; i += 2) {
        const x = p[i] * W, y = ((p[i + 1] - y0) / ySpan) * H;
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke(); ctx.restore();
    }
  }
  function cropRange(strokes) {
    let lo = 1, hi = 0;
    for (const s of strokes || []) for (let i = 1; i < s.p.length; i += 2) { lo = Math.min(lo, s.p[i]); hi = Math.max(hi, s.p[i]); }
    if (hi < lo) return [0, 1];
    lo = Math.max(0, lo - 0.07); hi = Math.min(1, hi + 0.07);

    return [lo, hi];

  function idbStore() {
    const DBN = "underline", VER = 1;
    const opened = new Promise((res, rej) => {
      const r = indexedDB.open(DBN, VER);
      r.onupgradeneeded = () => { const d = r.result; ["books", "pages", "images"].forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, { keyPath: "id" }); }); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    const tx = async (name, mode, fn) => {
      const d = await opened;
      return new Promise((res, rej) => {
        const t = d.transaction(name, mode), st = t.objectStore(name); let out;
        Promise.resolve(fn(st)).then(v => { out = v; });
        t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || { code: "quota_exceeded" });
      });
    };
    const req = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    const all = (name) => tx(name, "readonly", st => req(st.getAll()));
    let cb = () => {};
    const emit = async () => { cb("books", await all("books")); cb("pages", await all("pages")); };
    const nid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
    const urls = new Map();
    return {
      remote: false,
      async dump() { return { books: await all("books"), pages: await all("pages") }; },
      async blob(key) { const row = await tx("images", "readonly", st => req(st.get(key))); return row ? row.blob : null; },
      async clear() { for (const n of ["books", "pages", "images"]) await tx(n, "readwrite", st => st.clear()); },
      subscribe(f, onErr) { cb = f; emit().catch(e => onErr && onErr({ code: "storage" })); },
      async upload(blob) {
        const key = nid();
        await tx("images", "readwrite", st => st.put({ id: key, blob }));
        const url = URL.createObjectURL(blob); urls.set(key, url);
        return { id: "idb:" + key, url };
      },
      async readImage(key) {
        if (urls.has(key)) return urls.get(key);
        const row = await tx("images", "readonly", st => req(st.get(key)));
        if (!row) throw { code: "missing" };
        const url = URL.createObjectURL(row.blob); urls.set(key, url); return url;
      },
      async deleteImage(id) {
        if (!id || !id.startsWith("idb:")) return;
        const key = id.slice(4);

      async addBook(d) { const id = nid(); await tx("books", "readwrite", st => st.put({ id, ...d })); await emit(); return id; },
      async updateBook(id, d) {
        const cur = await tx("books", "readonly", st => req(st.get(id)));
        if (cur) await tx("books", "readwrite", st => st.put({ ...cur, ...d })); await emit();

    if (!sh || sh.loading) return `<div class="loading">같은 책을 읽은 사람들을 찾는 중…</div>`;
    if (sh.err) return `<section class="empty"><h2>불러오지 못했어요</h2><p>${esc(sh.err)}</p><button class="btn ghost" data-act="shared-retry">다시 불러오기</button></section>`;
    let h = `<p class="readers">『${esc(b.title)}』으로 묶인 독자 ${sh.readers}명</p>`;
    if (!sh.items.length) {
      h += `<section class="empty"><p>아직 이 책에 밑줄을 공유한 사람이 없어요.<br>첫 번째로 공유해 보세요.</p></section>`;
    } else {
      h += `<div class="cards">`;
      for (const it of sh.items) {
        const src = [`『${it.title || b.title}』`, it.author, it.page_no ? it.page_no + "쪽" : ""].filter(Boolean).join(", ");
        h += `<article class="card share-card">
          <p class="note-big">${esc(it.note).replace(/\n/g, "<br>")}</p>
          <p class="src">${esc(src)}</p>
          <div class="who"><span><b>${esc(it.name)}</b> · ${fmtDate(Number(it.created_at))}</span>${it.mine ? `<span class="chip">내 밑줄</span>` : `<button class="link-btn" data-act="report" data-id="${esc(it.id)}">신고</button>`}</div>
        </article>`;
      }
      h += `</div>`;
    }
    return h + `<p style="margin-top:20px"><button class="link-btn" data-act="terms">공유 이용 안내</button></p>`;
  }
  async function loadShared(bookId) {
    if (!store || !store.sharedFor) return;
    S.shared = { bookId, loading: true, items: [], readers: 0 };
    if (S.view === "book" && !ED.el) render();
    try { const r = await store.sharedFor(bookId); S.shared = { bookId, readers: r.readers || 0, items: r.items || [] }; }
    catch (e) { console.warn("shared load failed", e); S.shared = { bookId, err: errMsg(e), items: [], readers: 0 }; }
    if (S.view === "book" && S.bookId === bookId && !ED.el) render();
  }

  function render() {
    const scrollY = window.scrollY;
    const qFocused = document.activeElement && document.activeElement.id === "q";

    if (S.mode === "loading") { appEl.innerHTML = `<div class="loading">서재를 여는 중…</div>`; return; }
    if (S.mode === "auth") { appEl.innerHTML = viewAuth(); return; }
    appEl.innerHTML = S.view === "book" ? viewBook() : viewLibrary();
    hydrateImgs(appEl);
    appEl.querySelectorAll("canvas[data-crop]").forEach(c => { const p = S.pages.find(p => p.id === c.dataset.crop); if (p) paintCrop(c, p); });

  /* ---------- sheets ---------- */

  function bookSheet(book, opts = {}) {
    let coverBlob = null;
    const editing = !!book;
    const coverHTML = hasCover(book) ? coverImg(book) : `<span class="ph" style="font-size:12px;color:var(--muted)">표지</span>`;
    const shootBtn = `<label class="btn ghost file-btn" style="height:38px;font-size:14px">${cameraIcon()} 표지 ${editing ? "다시 " : ""}찍기<input id="cover-file" type="file" accept="image/*"></label>`;
    openSheet(`
      <h3>${opts.first ? "어떤 책인가요?" : editing ? "책 정보 고치기" : "책 등록"}</h3>
      ${opts.big ? `<div class="cover cover-big" id="cv">${coverHTML}</div><div style="display:flex;justify-content:center">${shootBtn}</div>` : `<div class="shot">
        <div class="cover" id="cv">${coverHTML}</div>

      <div class="field"><label for="ba">저자 (선택)</label><input id="ba" maxlength="80" placeholder="공유할 때 출처에 함께 표시돼요" value="${esc(book ? (book.author || "") : "")}"></div>
      <div class="sheet-actions"><button class="btn ghost" data-act="close">${opts.first ? "나중에" : "취소"}</button><button class="btn" id="bsave">${editing ? "저장" : "책장에 꽂기"}</button></div>`,
      (el) => {
        $("#cover-file", el).addEventListener("change", async (e) => {
          const f = e.target.files[0]; if (!f) return;
          try { const r = await shrink(f, 600); coverBlob = r.blob; $("#cv", el).innerHTML = `<img src="${URL.createObjectURL(r.blob)}" alt="">`; } catch { toast("사진을 읽지 못했어요."); }
        });
        if (opts.big) setTimeout(() => { const t = $("#bt", el); if (t && !t.value) t.focus(); }, 250);
        $("#bsave", el).addEventListener("click", async () => {
          const title = $("#bt", el).value.trim(), author = $("#ba", el).value.trim();
          if (!title) { toast("제목을 적어 주세요."); $("#bt", el).focus(); return; }
          busy(true);
          try {
            const d = { title, author };
            if (coverBlob) { const up = await store.upload(coverBlob, "cover"); d.coverId = up.id; d.coverUrl = up.id ? "" : up.url; }
            if (editing) { await store.updateBook(book.id, d); toast("책 정보를 고쳤어요."); if (S.bookTab === "shared" || S.shared) loadShared(book.id); }
            else { d.createdAt = Date.now(); const id = await store.addBook(d); S.view = "book"; S.bookId = id; toast("책장에 꽂았어요."); }

  /* ---------- page capture ---------- */
  async function addPageFromFile(file) {
    busy(true, "사진을 올리는 중…");
    try {
      const r = await shrink(file, 1200);
      const up = await store.upload(r.blob, "page");
      const id = await store.addPage({ bookId: S.bookId, imageId: up.id, imageUrl: up.id ? "" : up.url, w: r.w, h: r.h, strokes: [], pageNo: "", quote: "", note: "", createdAt: Date.now() });
      busy(false);
      openEditor(id, { imageId: up.id, url: up.url, w: r.w, h: r.h, strokes: [], pageNo: "", quote: "", note: "", bookId: S.bookId, fresh: true });
    } catch (e) { console.warn("add page failed", e); busy(false); toast(errMsg(e)); }
  }

  /* ---------- editor ---------- */
  let savedColor = "y"; try { savedColor = localStorage.getItem("underline-color") || "y"; } catch {}
  const ED = { el: null, id: null, page: null, strokes: [], tool: "mark", color: MARK_COLORS[savedColor] ? savedColor : "y", straight: false, cur: null, W: 0, H: 0, ctx: null, dirty: false };

  function openEditor(id, preset) {
    const p = preset || S.pages.find(p => p.id === id); if (!p) return;
    const book = S.books.find(b => b.id === (p.bookId || S.bookId)) || {};
    ED.id = id; ED.page = { ...p, imageUrl: (preset && preset.url) || "" }; ED.strokes = JSON.parse(JSON.stringify(p.strokes || [])); ED.orig = { strokes: JSON.stringify(p.strokes || []), quote: p.quote || "" }; ED.dirty = !!(preset && preset.fresh);
    const el = document.createElement("div"); el.className = "editor"; el.setAttribute("role", "dialog"); el.setAttribute("aria-label", "밑줄 긋기");
    el.innerHTML = `<div class="ed-inner">
      <div class="ed-top">
        <button class="back" id="ed-close">${backIcon()} 뒤로</button>
        <div class="ttl">${esc(titleOf(book))}</div>
        <span class="ed-actions"><button class="btn ghost save-btn" id="ed-del">삭제</button><button class="btn save-btn" id="ed-save">저장</button></span>
      </div>
      <div class="stage" id="stage"><div class="paper" id="paper"><img id="ed-img" alt="찍은 페이지"><canvas id="ed-cv"></canvas></div></div>
      <div class="tools">
        <div class="tool-group colors" role="radiogroup" aria-label="형광펜 색">
          ${Object.keys(MARK_COLORS).map(k => `<button class="color-dot" data-color="${k}" role="radio" aria-checked="${k === ED.color}" aria-label="${MARK_COLORS[k].name}" style="--dot:${MARK_COLORS[k].css}"></button>`).join("")}
        </div>
        <div class="tool-group">
          <button class="tool" id="t-undo" aria-label="되돌리기">${undoIcon()} 이전으로</button>
        </div>
      </div>
      <div class="ed-fields">
        <div class="field" style="max-width:140px"><label for="ed-pg">쪽수</label><input id="ed-pg" inputmode="numeric" maxlength="8" placeholder="예: 134" value="${esc(p.pageNo || "")}"></div>
        <div class="field"><label for="ed-n">메모</label><textarea id="ed-n" rows="3" maxlength="2000" placeholder="밑줄 그은 이유">${esc(p.note || "")}</textarea></div>
        ${store && store.sharedFor ? `<label class="share-row" for="ed-share"><span><b>같은 책 독자에게 공유</b><small id="ed-share-hint"></small></span><input type="checkbox" class="switch-input" id="ed-share" role="switch" ${p.shared ? "checked" : ""}></label>` : ""}
      </div></div>`;
    document.body.appendChild(el); ED.el = el; document.body.style.overflow = "hidden";

    const img = $("#ed-img", el), cv = $("#ed-cv", el), paper = $("#paper", el);
    img.onload = () => { layout(); };
    const noPhoto = () => { $("#stage", el).innerHTML = `<p class="no-photo">이 페이지는 사진이 없어요.<br>위의 ‘삭제’를 누르고 새로 찍어 주세요.</p>`; };
    img.onerror = noPhoto;
    (ED.page.imageUrl ? Promise.resolve(ED.page.imageUrl) : resolveSrc(p.imageId, p.imageUrl))
      .then(src => { if (!src) return noPhoto(); ED.page.imageUrl = src; img.src = src; })
      .catch(noPhoto);

    function layout() {
      const nw = img.naturalWidth, nh = img.naturalHeight;
      const maxW = $("#stage", el).clientWidth, maxH = Math.max(320, window.innerHeight * 0.64);
      const k = Math.min(maxW / nw, maxH / nh);
      ED.W = Math.round(nw * k); ED.H = Math.round(nh * k);
      paper.style.width = ED.W + "px"; paper.style.height = ED.H + "px";
      const dpr = Math.min(3, window.devicePixelRatio || 1);
      cv.width = Math.round(ED.W * dpr); cv.height = Math.round(ED.H * dpr);
      ED.ctx = cv.getContext("2d"); ED.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      redraw();
    }
    ED.layout = layout;
    window.addEventListener("resize", layout);

    el.querySelectorAll("[data-tool]").forEach(b => b.onclick = () => { ED.tool = b.dataset.tool; el.querySelectorAll("[data-tool]").forEach(x => x.setAttribute("aria-pressed", x === b)); });
    $("#t-undo", el).onclick = () => { if (ED.strokes.length) { ED.strokes.pop(); ED.dirty = true; redraw(); } };
    $("#ed-close", el).onclick = () => closeEditor();
    el.querySelectorAll("[data-color]").forEach(b => b.onclick = () => {
      ED.color = b.dataset.color; try { localStorage.setItem("underline-color", ED.color); } catch {}
      el.querySelectorAll("[data-color]").forEach(x => x.setAttribute("aria-checked", x === b));
    });
    $("#ed-save", el).onclick = saveEditor;
    ["ed-pg", "ed-n"].forEach(i => $("#" + i, el).addEventListener("input", () => { ED.dirty = true; }));
    const shareEl = $("#ed-share", el), noteEl = $("#ed-n", el);
    const syncShare = () => {
      if (!shareEl) return;
      const has = !!noteEl.value.trim();
      shareEl.disabled = !has; if (!has) shareEl.checked = false;
      $("#ed-share-hint", el).textContent = has ? "메모가 같은 책 독자에게 보여요. 사진은 공유되지 않아요." : "메모를 적으면 공유할 수 있어요";
    };
    if (shareEl) { syncShare(); noteEl.addEventListener("input", syncShare); shareEl.addEventListener("change", () => { ED.dirty = true; }); }
    const del = $("#ed-del", el);
    if (del) del.onclick = () => confirmSheet("이 페이지를 지울까요?", "사진과 밑줄, 메모가 함께 지워지고 되돌릴 수 없어요.", "지우기", async () => { await store.deletePage(ED.id); closeEditor(true); toast("페이지를 지웠어요."); });

    // drawing
    let active = null;
    const pt = (e) => { const r = cv.getBoundingClientRect(); return [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))]; };
    cv.addEventListener("pointerdown", (e) => {
      if (active !== null) { ED.cur = null; active = null; redraw(); return; } // second finger cancels
      e.preventDefault(); active = e.pointerId; try { cv.setPointerCapture(e.pointerId); } catch {}
      const [x, y] = pt(e);
      if (ED.tool === "erase") { eraseAt(x, y); return; }
      ED.cur = { t: ED.tool, c: ED.color, p: [x, y] };
    });
    cv.addEventListener("pointermove", (e) => {
      if (e.pointerId !== active) return;
      const [x, y] = pt(e);
      if (ED.tool === "erase") { eraseAt(x, y); return; }
      if (!ED.cur) return;
      const p = ED.cur.p, lx = p[p.length - 2], ly = p[p.length - 1];
      if (Math.hypot((x - lx) * ED.W, (y - ly) * ED.H) < 2) return;
      p.push(x, y); redraw();
    });
    const end = (e) => {
      if (e.pointerId !== active) return; active = null;
      const s = ED.cur; ED.cur = null; if (!s) return;
      const xs = s.p.filter((_, i) => i % 2 === 0), ys = s.p.filter((_, i) => i % 2 === 1);
      const span = Math.hypot((Math.max(...xs) - Math.min(...xs)) * ED.W, (Math.max(...ys) - Math.min(...ys)) * ED.H);
      if (span < 8) { redraw(); return; }
      if (ED.straight) { const y = ys.reduce((a, b) => a + b, 0) / ys.length; s.p = [Math.min(...xs), y, Math.max(...xs), y]; }
      s.p = s.p.map(v => Math.round(v * 10000) / 10000);
      ED.strokes.push(s); ED.dirty = true; redraw();
    };
    cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
  }

  function eraseAt(x, y) {
    const px = x * ED.W, py = y * ED.H;
    for (let i = ED.strokes.length - 1; i >= 0; i--) {
      const p = ED.strokes[i].p, tol = ED.strokes[i].t === "mark" ? Math.max(14, ED.W * 0.02) : 14;
      for (let j = 0; j + 3 < p.length; j += 2) {
        if (segDist(px, py, p[j] * ED.W, p[j + 1] * ED.H, p[j + 2] * ED.W, p[j + 3] * ED.H) < tol) { ED.strokes.splice(i, 1); ED.dirty = true; redraw(); return; }
      }
    }
  }
  function segDist(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy;
    let t = l ? ((px - ax) * dx + (py - ay) * dy) / l : 0; t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
  }
  function redraw() {
    if (!ED.ctx) return;
    ED.ctx.clearRect(0, 0, ED.W, ED.H);
    const list = ED.cur ? ED.strokes.concat([ED.straight && ED.cur.p.length > 2 ? straightPreview(ED.cur) : ED.cur]) : ED.strokes;
    drawStrokes(ED.ctx, list, ED.W, ED.H);
    const u = ED.el && $("#t-undo", ED.el); if (u) u.disabled = !ED.strokes.length;
  }
  function straightPreview(s) {
    const xs = s.p.filter((_, i) => i % 2 === 0), ys = s.p.filter((_, i) => i % 2 === 1);
    const y = ys.reduce((a, b) => a + b, 0) / ys.length;
    return { t: s.t, c: s.c, p: [Math.min(...xs), y, Math.max(...xs), y] };
  }
  async function saveEditor() {
    const el = ED.el;
    const d = { strokes: ED.strokes, pageNo: $("#ed-pg", el).value.trim(), note: $("#ed-n", el).value.trim(), updatedAt: Date.now() };
    const shareEl = $("#ed-share", el);
    if (shareEl) d.shared = shareEl.checked && !!d.note;
    const strokesChanged = JSON.stringify(ED.strokes) !== ED.orig.strokes;
    if (!ED.strokes.length) d.quote = "";
    const id = ED.id;
    busy(true);
    try {
      await store.updatePage(id, d); ED.dirty = false; closeEditor(true);
      if (S.shared && S.shared.bookId === S.bookId && "shared" in d) loadShared(S.bookId);
      toast("저장했어요.");
      if (strokesChanged && ED.strokes.length) cropToMarks(id);
    }
    catch (e) { toast(errMsg(e)); } finally { busy(false); }
  }

  // after saving, keep only the band of the page around the highlights (full width),
  // move the strokes onto the smaller photo, and delete the full page photo
  async function cropToMarks(id) {
    try {
      const p = S.pages.find(p => p.id === id);
      if (!p || !store.remote || !p.imageId || !/\/p2c?-/.test(p.imageId) || !(p.strokes || []).length) return;
      if (ED.el && ED.id === id) return; // being edited again; the next save will do it
      const img = await loadImg(await resolveSrc(p.imageId, p.imageUrl));
      const W = img.naturalWidth, H = img.naturalHeight;
      let lo = 1, hi = 0;
      for (const st of p.strokes) for (let i = 1; i < st.p.length; i += 2) { lo = Math.min(lo, st.p[i]); hi = Math.max(hi, st.p[i]); }
      const lh = Math.max(14, W * 0.032);
      const top = Math.max(0, Math.floor(lo * H - lh * 1.8)), bot = Math.min(H, Math.ceil(hi * H + lh * 1.8));
      if (bot - top > H * 0.85) return; // nothing much to save
      const c = document.createElement("canvas"); c.width = W; c.height = bot - top;
      c.getContext("2d").drawImage(img, 0, top, W, bot - top, 0, 0, W, bot - top);
      const blob = await encode(c, 0.7);
      const up = await store.upload(blob, "crop");
      const span = bot - top, r4 = (v) => Math.round(v * 10000) / 10000;
      const strokes = p.strokes.map(st => ({ ...st, p: st.p.map((v, i) => i % 2 ? r4((v * H - top) / span) : v) }));
      const old = p.imageId;
      await store.updatePage(id, { imageId: up.id, w: W, h: span, strokes });
      await store.deleteImage(old);
    } catch (e) { console.warn("crop failed", e); }
  }

  async function addBookFromFile(file) {
    busy(true, "표지를 올리는 중…");
    try {
      const r = await shrink(file, 600);
      const up = await store.upload(r.blob, "cover");
      const d = { title: "", coverId: up.id, coverUrl: up.id ? "" : up.url, createdAt: Date.now() };
      const id = await store.addBook(d);
      S.view = "book"; S.bookId = id; S.bookTab = "mine"; render(); window.scrollTo(0, 0);
      busy(false);
      const b = S.books.find(b => b.id === id); if (b) bookSheet(b, { big: true, first: true });
    } catch (e) { toast(errMsg(e)); } finally { busy(false); }
  }
  function closeEditor(force) {
    if (!force && ED.dirty) return saveEditor(); // going back keeps what was drawn and written
    if (ED.layout) window.removeEventListener("resize", ED.layout);
    if (ED.el) ED.el.remove(); ED.el = null; ED.ctx = null; document.body.style.overflow = "";
    render();
  }

  /* ---------- events ---------- */
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-act]"); if (!t) return;
    const a = t.dataset.act;
    if (a === "scrim") { if (e.target === t) closeSheet(); return; }
    if (a === "close") return closeSheet();
    if (a === "tab") { S.tab = t.dataset.tab; render(); return; }
    if (a === "logout") return confirmSheet("로그아웃할까요?", "기록은 계정에 그대로 남아 있어요. 다시 로그인하면 이어서 볼 수 있어요.", "로그아웃", async () => { await sb.auth.signOut(); location.reload(); });
    if (a === "migrate") return migrateLocal();
    if (a === "edit-title") { const b = S.books.find(b => b.id === S.bookId); if (b) bookSheet(b, { big: true }); return; }
    if (a === "book-tab") { S.bookTab = t.dataset.tab; render(); if (S.bookTab === "shared" && !(S.shared && S.shared.bookId === S.bookId && !S.shared.err)) loadShared(S.bookId); return; }
    if (a === "shared-retry") return loadShared(S.bookId);
    if (a === "terms") return termsSheet();
    if (a === "report") { const pid = t.dataset.id; return confirmSheet("이 밑줄을 신고할까요?", "신고한 밑줄은 내 화면에서 바로 사라지고, 신고가 쌓이면 모두에게서 숨겨져요.", "신고하기", async () => { await store.report(pid, ""); toast("신고했어요."); await loadShared(S.bookId); }); }
    if (a === "add-book") return bookSheet(null);
    if (a === "open-book") { S.view = "book"; S.bookId = t.dataset.id; S.bookTab = "mine"; render(); window.scrollTo(0, 0); loadShared(S.bookId); return; }
    if (a === "home") { S.view = "library"; render(); window.scrollTo(0, 0); return; }
    if (a === "book-menu") return bookMenu();
    if (a === "edit-page") return openEditor(t.dataset.id);
  });
  document.addEventListener("submit", async (e) => {
    if (e.target.id !== "auth-form") return;
    e.preventDefault();
    const name = $("#au-name").value.trim(), pw = $("#au-pw").value;
    const fail = (m) => { S.authErr = m; S.authName = name; const el = $("#au-err"); if (el) el.textContent = m; };
    if (name.length < 2) return fail("이름을 2자 이상 적어 주세요.");
    if (pw.length < 6) return fail("비밀번호는 6자 이상이어야 해요.");
    const go = $("#au-go"); go.disabled = true; fail("");
    try {
      // a name that exists signs in; a new name is created with this password
      const email = nameToEmail(name);
      let r = await sb.auth.signInWithPassword({ email, password: pw });
      if (r.error && /invalid login|credentials/i.test(r.error.message || "")) {
        const up = await sb.auth.signUp({ email, password: pw, options: { data: { username: name } } });
        if (up.error && /already registered|already exists/i.test(up.error.message || "")) throw { message: "wrong password" };
        r = up;
      }
      if (r.error) throw r.error;
      if (!r.data.session) throw { message: "no session" };
      S.authErr = ""; enter(r.data.session.user);
    } catch (err) {
      const m = String(err && err.message || "");
      fail(/wrong password|invalid login|credentials/i.test(m) ? "비밀번호가 맞지 않아요. (다른 사람이 쓰는 이름일 수도 있어요)"
        : /no session/.test(m) ? "가입은 됐지만 로그인하지 못했어요. 한 번 더 눌러 주세요."
        : /rate|too many/i.test(m) ? "잠시 후 다시 해 주세요."
        : /fetch|network/i.test(m) ? "인터넷 연결을 확인해 주세요."
        : "로그인하지 못했어요. 잠시 후 다시 해 주세요.");
      go.disabled = false;
    }
  });
  document.addEventListener("input", (e) => { if (e.target.id === "q") { S.q = e.target.value; render(); } });
  document.addEventListener("change", (e) => {
    if (e.target.dataset && e.target.dataset.file === "cover") { const f = e.target.files[0]; e.target.value = ""; if (f) addBookFromFile(f); return; }
    if (e.target.dataset && e.target.dataset.file === "backup") { const f = e.target.files[0]; e.target.value = ""; if (f) importBackup(f); return; }
    if (e.target.dataset && e.target.dataset.file === "page") { const f = e.target.files[0]; e.target.value = ""; if (f) { S.bookId = e.target.dataset.book; addPageFromFile(f); } return; }
    if (e.target.id === "page-file") { const f = e.target.files[0]; e.target.value = ""; if (f) addPageFromFile(f); }
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if (layer.innerHTML) closeSheet(); else if (ED.el) closeEditor(); } });

  /* ---------- icons ---------- */
  function plusIcon() { return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`; }
  function cameraIcon() { return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>`; }
  // cover button: a highlighter stroke across the top-left, camera tucked bottom-right
  function markCameraIcon() { return `<svg viewBox="0 0 30 30" aria-hidden="true"><path d="M6 10.5 L15 8.5" stroke="#ffd600" stroke-width="3" stroke-linecap="round"/><g transform="translate(11 11) scale(.68)" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></g></svg>`; }
  function backIcon() { return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>`; }
  function dotsIcon() { return `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>`; }
  function undoIcon() { return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6L4 11l5 5"/><path d="M4 11h10a5 5 0 010 10h-3"/></svg>`; }
  function searchIcon() { return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>`; }

  /* ---------- boot ---------- */
  function start(s, mode) {
    store = s; S.mode = mode;
    const timer = setTimeout(() => { if (!S.loaded.books) { S.err = "서재를 불러오지 못했어요. 연결을 확인하고 페이지를 다시 열어 주세요."; render(); } }, 10000);
    store.subscribe((kind, rows) => {
      S[kind] = rows; S.loaded[kind] = true; if (S.loaded.books) { clearTimeout(timer); S.err = ""; }
      if (!ED.el) render();
    }, (e) => { clearTimeout(timer); S.err = "서재를 불러오지 못했어요 (" + (e && e.code || "오류") + ")."; render(); });
    render();
  }
  async function migrateLocal() {
    const local = idbStore();
    busy(true, "계정으로 옮기는 중…");
    try {
      const { books, pages } = await local.dump();
      for (const b of books) {
        let coverId = "";
        if (b.coverId && b.coverId.startsWith("idb:")) { const bl = await local.blob(b.coverId.slice(4)); if (bl) coverId = (await store.upload(bl)).id; }
        const newId = await store.addBook({ title: b.title || "", coverId, ocr: b.ocr || "", createdAt: b.createdAt || Date.now() });
        for (const p of pages.filter(p => p.bookId === b.id)) {
          let imageId = "";
          if (p.imageId && p.imageId.startsWith("idb:")) { const bl = await local.blob(p.imageId.slice(4)); if (bl) imageId = (await store.upload(bl)).id; }
          await store.addPage({ bookId: newId, imageId, w: p.w, h: p.h, strokes: p.strokes || [], pageNo: p.pageNo || "", quote: p.quote || "", note: p.note || "", ocr: p.ocr === "pending" ? "failed" : (p.ocr || ""), createdAt: p.createdAt || Date.now() });
        }
      }
      await local.clear(); S.localCount = 0; render(); toast("이 폰의 기록을 계정으로 옮겼어요.");
    } catch (e) { console.warn("migrate failed", e); toast(errMsg(e)); } finally { busy(false); }
  }
  // bring in the backup file made by the earlier Claude-link version
  async function importBackup(file) {
    let data;
    try { data = JSON.parse(await file.text()); } catch { toast("백업 파일을 읽지 못했어요."); return; }
    if (!data || data.app !== "underline" || !Array.isArray(data.books)) { toast("_밑줄. 백업 파일이 아니에요."); return; }
    const images = data.images || {}, pages = Array.isArray(data.pages) ? data.pages : [];
    const toBlob = async (key) => { const d = key && images[key]; if (!d) return null; return await (await fetch(d)).blob(); };
    const have = new Set(S.books.map(b => (b.title || "") + "|" + b.createdAt));
    const todo = data.books.filter(b => !have.has((b.title || "") + "|" + (b.createdAt || 0)));
    if (!todo.length) { toast("이미 모두 가져온 기록이에요."); return; }
    let done = 0, failed = 0;
    try {
      for (const b of todo) {
        busy(true, `가져오는 중… ${done + 1}/${todo.length}권`);
        let coverId = "";
        try { const bl = await toBlob(b.photo); if (bl) coverId = (await store.upload(bl)).id; } catch { failed++; }
        const newId = await store.addBook({ title: b.title || "", coverId, ocr: b.title ? "done" : "", createdAt: b.createdAt || Date.now() });
        for (const p of pages.filter(p => p.bookId === b.id)) {
          let imageId = "";
          try { const bl = await toBlob(p.photo); if (bl) imageId = (await store.upload(bl)).id; } catch { failed++; }
          await store.addPage({ bookId: newId, imageId, w: p.w || null, h: p.h || null, strokes: p.strokes || [], pageNo: p.pageNo || "", quote: p.quote || "", note: p.note || "", ocr: p.quote ? "done" : "", createdAt: p.createdAt || Date.now(), updatedAt: p.updatedAt || null });
        }
        done++;
      }
      toast(`책 ${done}권을 가져왔어요.` + (failed ? ` 사진 ${failed}장은 가져오지 못했어요.` : ""));
    } catch (e) { console.warn("import failed", e); toast(`${done}권까지 가져왔어요. ` + errMsg(e)); }
    finally { busy(false); }
  }
  async function countLocal() {
    try { if (!window.indexedDB) return 0; const { books } = await idbStore().dump(); return books.length; } catch { return 0; }
  }
  function enter(user) {
    S.user = (user.user_metadata && user.user_metadata.username) || "";
    if (sb && S.user) sb.from("profiles").upsert({ id: user.id, username: S.user, updated_at: new Date().toISOString() }).then(() => {}, () => {});
    S.mode = "loading"; render();
    start(cloudStore(user.id), "remote");
    countLocal().then(n => { S.localCount = n; if (n && !ED.el) render(); });
  }
  async function boot() {
    if (!sb) { S.mode = "local"; S.err = "서버에 연결하지 못했어요. 인터넷 연결을 확인하고 다시 열어 주세요."; S.loaded.books = true; render(); return; }
    const { data } = await sb.auth.getSession();
    if (data && data.session) return enter(data.session.user);
    S.mode = "auth"; render();
  }
  boot();
})();
</script>
</body>
</html>
