<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>_밑줄.</title>
<meta name="description" content="책에서 밑줄 그은 문장을 사진으로 모아 두는 독서 기록 앱">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="_밑줄.">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); color-scheme: light; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: one narrow phone column, paper-white sheet, ink-black type; photos are the only color. */
:root {
  --bg: #ffffff;
  --fg: #111111;
  --muted: #6e6e6e;
  --line: #e6e6e6;
  --soft: #f4f4f4;
  --ink-inv: #ffffff;
  --mark: rgba(255, 214, 0, .45);
  --font-display: "Pretendard Variable", "Pretendard", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-body: "Pretendard Variable", "Pretendard", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg:#0d0d0d; --fg:#f2f2f2; --muted:#9a9a9a; --line:#262626; --soft:#181818; --ink-inv:#0d0d0d; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg:#0d0d0d; --fg:#f2f2f2; --muted:#9a9a9a; --line:#262626; --soft:#181818; --ink-inv:#0d0d0d; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, textarea { font: inherit; color: var(--fg); }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

.app { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: 120px; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-block: 14px 10px; border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: -0.04em; line-height: 1.2; }
.tabs { display: flex; gap: 20px; margin-top: 10px; }
.tab { font-size: 14px; font-weight: 500; color: var(--muted); padding-block: 4px; border-bottom: 2px solid transparent; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--fg); }
.back { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
.icon-btn { width: 36px; height: 36px; display: inline-grid; place-items: center; border-radius: 50%; }
.icon-btn:active { background: var(--soft); }

.notice { margin-top: 14px; font-size: 12.5px; color: var(--muted); border: 1px dashed var(--line); padding: 10px 12px; }

/* Library grid */
.section-label { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 22px 0 12px; display: flex; justify-content: space-between; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 16px; }
@media (min-width: 480px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.book { text-align: left; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.cover { aspect-ratio: 2 / 3; width: 100%; max-width: 100%; background: var(--soft); border: 1px solid var(--line); overflow: hidden; display: grid; place-items: center; position: relative; }
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cover .ph { font-family: var(--font-display); font-weight: 700; font-size: 15px; padding: 12px; text-align: center; line-height: 1.35; text-wrap: balance; }
.cover .badge { position: absolute; right: 6px; bottom: 6px; background: var(--fg); color: var(--ink-inv); font-size: 11px; font-weight: 600; padding: 2px 7px; font-variant-numeric: tabular-nums; }
.book-title { font-weight: 600; font-size: 14px; line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.book-link { text-align: left; display: grid; gap: 2px; min-width: 0; }
.book-count { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.add-chip { position: absolute; right: 6px; bottom: 6px; width: 32px; height: 32px; border-radius: 50%; background: var(--fg); color: var(--ink-inv); display: grid; place-items: center; pointer-events: none; }
.add-chip svg { width: 16px; height: 16px; }

/* Empty state */
.empty { text-align: center; padding: 56px 12px 24px; display: grid; gap: 14px; justify-items: center; }
.empty h2 { font-family: var(--font-display); font-size: 22px; font-weight: 700; margin: 0; text-wrap: balance; }
.empty p { color: var(--muted); margin: 0; max-width: 30ch; }
.steps { display: grid; gap: 10px; text-align: left; margin-top: 8px; width: 100%; max-width: 320px; }
.steps li { list-style: none; display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; font-size: 14px; }
.steps li b { width: 22px; height: 22px; display: grid; place-items: center; border: 1.5px solid var(--fg); border-radius: 50%; font-size: 12px; }
.steps ol { padding: 0; margin: 0; display: grid; gap: 10px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 20px; background: var(--fg); color: var(--ink-inv); font-weight: 600; font-size: 15px; border-radius: 999px; }
.btn.ghost { background: transparent; color: var(--fg); border: 1.5px solid var(--fg); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .4; }
.btn.danger { background: transparent; color: var(--fg); border: 1.5px solid var(--line); }
.fab { position: fixed; z-index: 25; right: max(20px, calc(env(safe-area-inset-right, 0px) + 20px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); height: 56px; padding: 0 22px; border-radius: 999px; background: var(--fg); color: var(--ink-inv); font-weight: 600; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
@media (min-width: 600px) { .fab { right: calc(50% - 280px + 16px); } }

/* Book detail */
.book-head { display: grid; grid-template-columns: 92px minmax(0,1fr); gap: 16px; margin-top: 18px; align-items: end; }
.book-head .cover { width: 92px; }
.book-head h1 { font-family: var(--font-display); font-weight: 800; font-size: 24px; letter-spacing: -0.02em; line-height: 1.25; margin: 0 0 4px; text-wrap: balance; }
.book-head .meta { color: var(--muted); font-size: 13.5px; }
.book-head .count { margin-top: 10px; font-size: 13px; font-variant-numeric: tabular-nums; }
.row-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }

/* Highlight cards */
.cards { display: grid; gap: 18px; }
.card { display: grid; gap: 10px; padding-bottom: 18px; border-bottom: 1px solid var(--line); text-align: left; width: 100%; min-width: 0; }
.card canvas { width: 100%; display: block; background: var(--soft); border: 1px solid var(--line); }
.card .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.card .meta b { color: var(--fg); font-weight: 600; }
.card .quote { font-family: var(--font-display); font-size: 17px; line-height: 1.65; font-weight: 600; letter-spacing: -0.01em; margin: 0; overflow-wrap: anywhere; }
.card .note { font-size: 14px; color: var(--muted); margin: 0; padding-left: 12px; border-left: 2px solid var(--fg); overflow-wrap: anywhere; }
.card .nomark { font-size: 12.5px; color: var(--muted); }
.card .reading { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.card .reading::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--muted); border-top-color: transparent; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.card.text-card .quote { font-size: 18px; }

.search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 999px; padding: 0 14px; height: 42px; margin-top: 16px; background: var(--soft); }
.search input { border: 0; background: transparent; outline: none; flex: 1; min-width: 0; font-size: 15px; }

/* Sheets */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; border-radius: 18px 18px 0 0; padding: 20px max(18px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 20px) max(18px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; max-height: 92%; overflow-y: auto; }
.sheet h3 { font-family: var(--font-display); font-size: 20px; margin: 0; }
.sheet p { margin: 0; color: var(--muted); font-size: 14px; }
.field { display: grid; gap: 6px; }
.field label { font-size: 12.5px; font-weight: 600; letter-spacing: .02em; }
.field input, .field textarea { border: 0; border-bottom: 1.5px solid var(--line); background: transparent; padding: 8px 0; font-size: 16px; outline: none; resize: none; border-radius: 0; }
.field input:focus, .field textarea:focus { border-bottom-color: var(--fg); }
.shot { display: grid; grid-template-columns: 84px minmax(0,1fr); gap: 14px; align-items: center; }
.shot .cover { width: 84px; }
.shot .hint { font-size: 13px; color: var(--muted); display: grid; gap: 8px; justify-items: start; }
.file-btn { position: relative; overflow: hidden; }
.fab.file-btn { position: fixed; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.sheet-actions { display: flex; gap: 10px; }
.sheet-actions .btn { flex: 1; }

/* Editor */
.editor { position: fixed; inset: 0; z-index: 35; background: var(--bg); overflow-y: auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.ed-inner { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: 28px; }
.ed-top { display: flex; align-items: center; justify-content: space-between; padding-block: 10px; gap: 8px; }
.ed-top .ttl { font-size: 13.5px; color: var(--muted); text-align: center; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.save-btn { height: 36px; padding: 0 16px; font-size: 14px; }
.stage { background: var(--soft); display: grid; place-items: center; padding: 10px 0; min-height: 200px; }
.paper { position: relative; touch-action: none; user-select: none; -webkit-user-select: none; max-width: 100%; }
.paper img { display: block; width: 100%; height: 100%; pointer-events: none; -webkit-user-drag: none; }
.paper canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.tools { display: flex; gap: 6px; padding-block: 12px; justify-content: space-between; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tool-group { display: flex; gap: 6px; }
.tool { height: 40px; min-width: 40px; padding: 0 12px; border-radius: 999px; border: 1.5px solid var(--line); display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 500; }
.tool[aria-pressed="true"] { background: var(--fg); color: var(--ink-inv); border-color: var(--fg); }
.tool:disabled { opacity: .35; }
.swatch-pen { width: 16px; height: 3px; background: currentColor; }
.swatch-mark { width: 16px; height: 9px; background: var(--mark); outline: 1px solid currentColor; outline-offset: -1px; }
.ed-fields { display: grid; gap: 16px; padding-top: 16px; }
.ed-fields .two { display: grid; grid-template-columns: 96px minmax(0,1fr); gap: 14px; }
.tip { font-size: 12.5px; color: var(--muted); padding-top: 10px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 92px); background: var(--fg); color: var(--ink-inv); padding: 10px 16px; border-radius: 999px; font-size: 13.5px; z-index: 60; max-width: calc(100% - 32px); text-align: center; }
.loading { text-align: center; color: var(--muted); padding: 60px 0; font-size: 14px; }
.busy { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.35); display: grid; place-items: center; }
.busy span { background: var(--bg); color: var(--fg); padding: 14px 20px; border-radius: 12px; font-size: 14px; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .22s ease-out; } @keyframes up { from { transform: translateY(24px); opacity: .6; } } }
</style>
</head>
<body>
<div class="app" id="app"><div class="loading">서재를 여는 중…</div></div>
<div id="layer"></div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
(() => {
  "use strict";
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const appEl = $("#app"), layer = $("#layer");

  const S = { mode: "loading", books: [], pages: [], view: "library", tab: "books", bookId: null, q: "", loaded: { books: false, pages: false }, err: "" };
  let store = null;

  /* ---------- image helpers ---------- */
  function loadImg(src) {
    return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
  }
  const imgCache = new Map();
  function cachedImg(src) { if (!imgCache.has(src)) imgCache.set(src, loadImg(src)); return imgCache.get(src); }

  async function shrink(file, max) {
    const url = URL.createObjectURL(file);
    try {
      const img = await loadImg(url);
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.82));
      return { blob, w, h };
    } finally { URL.revokeObjectURL(url); }
  }
  const blobToDataURL = (b) => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });

  /* ---------- stroke drawing (coords normalized 0..1 to image) ---------- */
  function drawStrokes(ctx, strokes, W, H, y0 = 0, ySpan = 1) {
    for (const s of strokes || []) {
      const p = s.p; if (!p || p.length < 4) continue;
      ctx.save();
      ctx.lineCap = s.t === "mark" ? "butt" : "round"; ctx.lineJoin = "round";
      if (s.t === "mark") { ctx.strokeStyle = "rgba(255,214,0,.45)"; ctx.lineWidth = Math.max(8, W * 0.032); ctx.globalCompositeOperation = "multiply"; }
      else { ctx.strokeStyle = "#111"; ctx.lineWidth = Math.max(2, W * 0.0045); }
      ctx.beginPath();
      for (let i = 0; i < p.length; i += 2) {
        const x = p[i] * W, y = ((p[i + 1] - y0) / ySpan) * H;
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke(); ctx.restore();
    }
  }
  function cropRange(strokes) {
    let lo = 1, hi = 0;
    for (const s of strokes || []) for (let i = 1; i < s.p.length; i += 2) { lo = Math.min(lo, s.p[i]); hi = Math.max(hi, s.p[i]); }
    if (hi < lo) return [0, 1];
    lo = Math.max(0, lo - 0.07); hi = Math.min(1, hi + 0.07);
    if (hi - lo < 0.16) { const m = (lo + hi) / 2; lo = Math.max(0, m - 0.08); hi = Math.min(1, m + 0.08); }
    return [lo, hi];
  }
  async function paintCrop(canvas, page) {
    try {
      const img = await cachedImg(await resolveSrc(page.imageId, page.imageUrl));
      const [a, b] = cropRange(page.strokes);
      const cssW = canvas.clientWidth || 320, dpr = Math.min(2, window.devicePixelRatio || 1);
      const W = Math.round(cssW * dpr), H = Math.round(W * (img.naturalHeight * (b - a)) / img.naturalWidth);
      canvas.width = W; canvas.height = H; canvas.style.aspectRatio = W + " / " + H;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, a * img.naturalHeight, img.naturalWidth, (b - a) * img.naturalHeight, 0, 0, W, H);
      drawStrokes(ctx, page.strokes, W, H, a, b - a);
    } catch { canvas.style.aspectRatio = "3 / 1"; }
  }

  /* ---------- stores ---------- */
  function idbStore() {
    const DBN = "underline", VER = 1;
    const opened = new Promise((res, rej) => {
      const r = indexedDB.open(DBN, VER);
      r.onupgradeneeded = () => { const d = r.result; ["books", "pages", "images"].forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, { keyPath: "id" }); }); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    const tx = async (name, mode, fn) => {
      const d = await opened;
      return new Promise((res, rej) => {
        const t = d.transaction(name, mode), st = t.objectStore(name); let out;
        Promise.resolve(fn(st)).then(v => { out = v; });
        t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || { code: "quota_exceeded" });
      });
    };
    const req = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    const all = (name) => tx(name, "readonly", st => req(st.getAll()));
    let cb = () => {};
    const emit = async () => { cb("books", await all("books")); cb("pages", await all("pages")); };
    const nid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
    const urls = new Map();
    return {
      remote: false,
      subscribe(f, onErr) { cb = f; emit().catch(e => onErr && onErr({ code: "storage" })); },
      async upload(blob) {
        const key = nid();
        await tx("images", "readwrite", st => st.put({ id: key, blob }));
        const url = URL.createObjectURL(blob); urls.set(key, url);
        return { id: "idb:" + key, url };
      },
      async readImage(key) {
        if (urls.has(key)) return urls.get(key);
        const row = await tx("images", "readonly", st => req(st.get(key)));
        if (!row) throw { code: "missing" };
        const url = URL.createObjectURL(row.blob); urls.set(key, url); return url;
      },
      async deleteImage(id) {
        if (!id || !id.startsWith("idb:")) return;
        const key = id.slice(4);
        await tx("images", "readwrite", st => st.delete(key));
        if (urls.has(key)) { URL.revokeObjectURL(urls.get(key)); urls.delete(key); }
      },
      async addBook(d) { const id = nid(); await tx("books", "readwrite", st => st.put({ id, ...d })); await emit(); return id; },
      async updateBook(id, d) {
        const cur = await tx("books", "readonly", st => req(st.get(id)));
        if (cur) await tx("books", "readwrite", st => st.put({ ...cur, ...d })); await emit();
      },
      async deleteBook(id) {
        for (const p of S.pages.filter(p => p.bookId === id)) await this.deletePage(p.id, true);
        const b = S.books.find(b => b.id === id); if (b) await this.deleteImage(b.coverId);
        await tx("books", "readwrite", st => st.delete(id)); await emit();
      },
      async addPage(d) { const id = nid(); await tx("pages", "readwrite", st => st.put({ id, ...d })); await emit(); return id; },
      async updatePage(id, d) {
        const cur = await tx("pages", "readonly", st => req(st.get(id)));
        if (cur) await tx("pages", "readwrite", st => st.put({ ...cur, ...d })); await emit();
      },
      async deletePage(id, quiet) {
        const p = S.pages.find(p => p.id === id); if (p) await this.deleteImage(p.imageId);
        await tx("pages", "readwrite", st => st.delete(id)); if (!quiet) await emit();
      }
    };
  }

  /* ---------- feedback ---------- */
  let toastT;
  function toast(msg) {
    let t = $(".toast"); if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
    t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600);
  }
  function busy(on, msg = "저장하는 중…") {
    let b = $(".busy");
    if (on) { if (!b) { b = document.createElement("div"); b.className = "busy"; b.innerHTML = "<span></span>"; document.body.appendChild(b); } b.firstChild.textContent = msg; b.hidden = false; }
    else if (b) b.hidden = true;
  }
  function errMsg(e) {
    const c = e && e.code;
    if (e && e.name === "QuotaExceededError") return "폰 저장 공간이 부족해요. 안 쓰는 페이지를 지워 주세요.";
    if (c === "too_large") return "사진이 너무 커요. 다른 사진으로 해 보세요.";
    if (c === "quota_exceeded" || c === "quota_or_state") return "저장 공간이 가득 찼어요. 안 쓰는 페이지를 지워 주세요.";
    return "저장하지 못했어요. 잠시 후 다시 해 보세요.";
  }

  /* ---------- derived ---------- */
  const pagesOf = (bookId) => S.pages.filter(p => p.bookId === bookId).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  const hasCover = (b) => !!(b && (b.coverId || b.coverUrl));
  const coverImg = (b) => `<img data-img="${esc(b.coverId || "")}" data-url="${esc(b.coverUrl || "")}" alt="">`;
  const srcCache = new Map();
  function resolveSrc(id, url) {
    if (!id) return Promise.resolve(url || "");
    if (!id.startsWith("idb:")) return Promise.resolve(url || "");
    if (!srcCache.has(id)) srcCache.set(id, store.readImage(id.slice(4)).catch(e => { srcCache.delete(id); throw e; }));
    return srcCache.get(id);
  }
  function hydrateImgs(root) {
    root.querySelectorAll("img[data-img]").forEach(img => {
      resolveSrc(img.dataset.img, img.dataset.url).then(src => { if (src) img.src = src; }).catch(() => {});
    });
  }
  const titleOf = (b) => (b && b.title) || (b && b.ocr === "pending" ? "제목 읽는 중…" : "제목 없는 책");
  const fmtDate = (t) => { if (!t) return ""; const d = new Date(t); return d.getFullYear() + "." + String(d.getMonth() + 1).padStart(2, "0") + "." + String(d.getDate()).padStart(2, "0"); };
  const markCount = (p) => (p.strokes || []).length;

  /* ---------- views ---------- */
  function header(inner) { return `<header class="top">${inner}</header>`; }

  function viewLibrary() {
    const books = S.books.slice().sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    let h = header(`
      <div class="top-row">
        <div class="brand">_밑줄.</div>
      </div>
      <nav class="tabs" role="tablist">
        <button class="tab" role="tab" data-act="tab" data-tab="books" aria-selected="${S.tab === "books"}">책장</button>
        <button class="tab" role="tab" data-act="tab" data-tab="marks" aria-selected="${S.tab === "marks"}">밑줄 모아보기</button>
      </nav>`);
    if (!S.books.length && S.loaded.books) h += `<p class="notice">기록은 이 폰 안에만 저장돼요. 공유 버튼 → ‘홈 화면에 추가’로 앱처럼 설치해 두면 기록이 지워지지 않고 오래 남아요.</p>`;
    if (S.err) h += `<p class="notice">${esc(S.err)}</p>`;

    if (S.tab === "marks") return h + viewMarks();

    if (!S.loaded.books) return h + `<div class="loading">책장을 불러오는 중…</div>`;
    if (!books.length) {
      return h + `<section class="empty">
        <h2>아직 꽂힌 책이 없어요</h2>
        <p>읽고 있는 책의 표지를 찍어서 첫 책을 꽂아 보세요.</p>
        <ol class="steps">
          <li><b>1</b><span>표지를 찍어 책을 등록해요</span></li>
          <li><b>2</b><span>표지를 누르고 마음에 드는 페이지를 찍어요</span></li>
          <li><b>3</b><span>사진 위에 손가락으로 밑줄을 그어요</span></li>
        </ol>
        <label class="btn file-btn" style="margin-top:10px">${cameraIcon()} 첫 책 등록하기<input type="file" accept="image/*" data-file="cover"></label>
      </section>`;
    }
    h += `<div class="section-label"><span>책장</span><span>최근 등록순</span></div><div class="grid">`;
    for (const b of books) {
      const n = pagesOf(b.id).length;
      h += `<div class="book">
        <label class="cover file-btn" aria-label="${esc(titleOf(b))}에 밑줄 페이지 추가">${hasCover(b) ? coverImg(b) : `<span class="ph">${esc(titleOf(b))}</span>`}<span class="add-chip">${cameraIcon()}</span><input type="file" accept="image/*" data-file="page" data-book="${esc(b.id)}"></label>
        <button class="book-link" data-act="open-book" data-id="${esc(b.id)}"><span class="book-title">${esc(titleOf(b))}</span><span class="book-count">밑줄 ${n}쪽 보기 ›</span></button>
      </div>`;
    }
    h += `</div><label class="fab file-btn">${plusIcon()} 책 등록<input type="file" accept="image/*" data-file="cover"></label>`;
    return h;
  }

  function matches(p) {
    const q = S.q.trim().toLowerCase(); if (!q) return true;
    const b = S.books.find(b => b.id === p.bookId) || {};
    return [p.quote, p.note, b.title, b.author, p.pageNo].some(v => String(v || "").toLowerCase().includes(q));
  }
  function cardHTML(p, showBook) {
    const b = S.books.find(b => b.id === p.bookId) || {};
    const meta = `<div class="meta"><span>${showBook ? `<b>${esc(titleOf(b))}</b> · ` : ""}${p.pageNo ? esc(p.pageNo) + "쪽" : "쪽수 없음"}</span><span>${fmtDate(p.createdAt)}</span></div>`;
    const quoteHTML = p.quote ? `<p class="quote">${esc(p.quote).replace(/\n/g, "<br>")}</p>` : "";
    if (showBook && p.quote) {
      return `<button class="card text-card" data-act="edit-page" data-id="${esc(p.id)}">${meta}${quoteHTML}
        ${p.note ? `<p class="note">${esc(p.note)}</p>` : ""}
      </button>`;
    }
    return `<button class="card" data-act="edit-page" data-id="${esc(p.id)}">
      ${meta}
      <canvas data-crop="${esc(p.id)}" aria-label="밑줄 그은 부분"></canvas>
      ${p.ocr === "pending" ? `<span class="reading">밑줄 문장을 글자로 옮기는 중…</span>` : ""}
      ${p.ocr === "failed" && !p.quote ? `<span class="nomark">글자를 읽지 못했어요 · 눌러서 직접 적을 수 있어요</span>` : ""}
      ${quoteHTML}
      ${p.note ? `<p class="note">${esc(p.note)}</p>` : ""}
      ${markCount(p) ? "" : `<span class="nomark">아직 밑줄이 없어요 · 눌러서 긋기</span>`}
    </button>`;
  }
  function viewMarks() {
    let h = `<label class="search"><span aria-hidden="true">${searchIcon()}</span><input id="q" type="search" placeholder="문장, 생각, 책 제목으로 찾기" value="${esc(S.q)}" autocomplete="off"></label>`;
    if (!S.loaded.pages) return h + `<div class="loading">밑줄을 불러오는 중…</div>`;
    const list = S.pages.filter(p => markCount(p) && matches(p)).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    if (!list.length) return h + `<section class="empty"><h2>${S.q ? "찾는 밑줄이 없어요" : "모아 볼 밑줄이 아직 없어요"}</h2><p>${S.q ? "다른 단어로 찾아보세요. 밑줄 문장을 옮겨 적어 두면 검색에 걸려요." : "책장에서 책을 열고 페이지를 찍어 밑줄을 그어 보세요."}</p></section>`;
    h += `<div class="section-label"><span>밑줄 ${list.length}쪽</span><span>최근순</span></div><div class="cards">`;
    for (const p of list) h += cardHTML(p, true);
    return h + `</div>`;
  }

  function viewBook() {
    const b = S.books.find(b => b.id === S.bookId);
    if (!b) { S.view = "library"; return viewLibrary(); }
    const ps = pagesOf(b.id);
    let h = header(`<div class="top-row"><button class="back" data-act="home">${backIcon()} 책장</button><button class="icon-btn" data-act="book-menu" aria-label="책 관리">${dotsIcon()}</button></div>`);
    h += `<section class="book-head">
      <div class="cover">${hasCover(b) ? coverImg(b) : `<span class="ph" style="font-size:12px">${esc(titleOf(b))}</span>`}</div>
      <div><h1>${esc(titleOf(b))}</h1>${b.ocr === "pending" ? `<div class="meta">표지에서 제목을 읽는 중…</div>` : ""}<div class="count">밑줄 페이지 ${ps.length}쪽 · ${fmtDate(b.createdAt)} 등록</div></div>
    </section>`;
    if (!ps.length) {
      h += `<section class="empty"><h2>첫 밑줄을 그어 볼까요</h2><p>마음에 드는 문장이 있는 페이지를 찍으면, 그 위에 바로 밑줄을 그을 수 있어요.</p></section>`;
    } else {
      h += `<div class="section-label"><span>밑줄 페이지</span><span>최근순</span></div><div class="cards">`;
      for (const p of ps) h += cardHTML(p, false);
      h += `</div>`;
    }
    h += `<label class="fab file-btn">${cameraIcon()} 페이지 추가<input id="page-file" type="file" accept="image/*"></label>`;
    return h;
  }

  function render() {
    const scrollY = window.scrollY;
    const qFocused = document.activeElement && document.activeElement.id === "q";
    const caret = qFocused ? document.activeElement.selectionStart : null;
    if (S.mode === "loading") { appEl.innerHTML = `<div class="loading">서재를 여는 중…</div>`; return; }
    appEl.innerHTML = S.view === "book" ? viewBook() : viewLibrary();
    hydrateImgs(appEl);
    appEl.querySelectorAll("canvas[data-crop]").forEach(c => { const p = S.pages.find(p => p.id === c.dataset.crop); if (p) paintCrop(c, p); });
    if (qFocused) { const q = $("#q"); if (q) { q.focus(); try { q.setSelectionRange(caret, caret); } catch {} } }
    window.scrollTo(0, scrollY);
  }

  /* ---------- sheets ---------- */
  function openSheet(html, onMount) {
    layer.innerHTML = `<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
    hydrateImgs(layer);
    onMount && onMount($(".sheet", layer));
  }
  const closeSheet = () => { layer.innerHTML = ""; };

  function bookSheet(book) {
    let coverBlob = null;
    const editing = !!book;
    openSheet(`
      <h3>${editing ? "책 정보 고치기" : "책 등록"}</h3>
      <div class="shot">
        <div class="cover" id="cv">${hasCover(book) ? coverImg(book) : `<span class="ph" style="font-size:12px;color:var(--muted)">표지</span>`}</div>
        <div class="hint"><span>표지를 정면에서 찍으면 책장이 깔끔해져요.</span>
          <label class="btn ghost file-btn" style="height:38px;font-size:14px">${cameraIcon()} 표지 ${editing ? "다시 " : ""}찍기<input id="cover-file" type="file" accept="image/*" capture="environment"></label></div>
      </div>
      <div class="field"><label for="bt">제목</label><input id="bt" maxlength="120" placeholder="예: 소년이 온다" value="${esc(book ? book.title : "")}"></div>
      <div class="sheet-actions"><button class="btn ghost" data-act="close">취소</button><button class="btn" id="bsave">${editing ? "저장" : "책장에 꽂기"}</button></div>`,
      (el) => {
        $("#cover-file", el).addEventListener("change", async (e) => {
          const f = e.target.files[0]; if (!f) return;
          try { const r = await shrink(f, 900); coverBlob = r.blob; $("#cv", el).innerHTML = `<img src="${URL.createObjectURL(r.blob)}" alt="">`; } catch { toast("사진을 읽지 못했어요."); }
        });
        $("#bsave", el).addEventListener("click", async () => {
          const title = $("#bt", el).value.trim();
          if (!title) { toast("제목을 적어 주세요."); $("#bt", el).focus(); return; }
          busy(true);
          try {
            const d = { title };
            if (coverBlob) { const up = await store.upload(coverBlob); d.coverId = up.id; d.coverUrl = up.id ? "" : up.url; }
            if (editing) { await store.updateBook(book.id, d); toast("책 정보를 고쳤어요."); }
            else { d.createdAt = Date.now(); const id = await store.addBook(d); S.view = "book"; S.bookId = id; toast("책장에 꽂았어요."); }
            closeSheet(); render(); window.scrollTo(0, 0);
          } catch (e) { toast(errMsg(e)); } finally { busy(false); }
        });
      });
  }

  function confirmSheet(title, body, okLabel, onOk) {
    openSheet(`<h3>${esc(title)}</h3><p>${esc(body)}</p>
      <div class="sheet-actions"><button class="btn ghost" data-act="close">취소</button><button class="btn" id="cok">${esc(okLabel)}</button></div>`,
      (el) => $("#cok", el).addEventListener("click", async () => { closeSheet(); busy(true, "지우는 중…"); try { await onOk(); } catch (e) { toast(errMsg(e)); } finally { busy(false); } }));
  }

  function bookMenu() {
    const b = S.books.find(b => b.id === S.bookId); if (!b) return;
    openSheet(`<h3>${esc(titleOf(b))}</h3>
      <button class="btn ghost block" id="m-edit">책 정보 고치기</button>
      <button class="btn danger block" id="m-del">책 지우기</button>
      <button class="btn ghost block" data-act="close" style="border-color:transparent">닫기</button>`, (el) => {
      $("#m-edit", el).onclick = () => bookSheet(b);
      $("#m-del", el).onclick = () => confirmSheet("이 책을 지울까요?", `「${titleOf(b)}」과 밑줄 페이지 ${pagesOf(b.id).length}쪽이 모두 지워지고 되돌릴 수 없어요.`, "지우기", async () => {
        await store.deleteBook(b.id); S.view = "library"; render(); toast("책을 지웠어요.");
      });
    });
  }

  /* ---------- page capture ---------- */
  async function addPageFromFile(file) {
    busy(true, "사진을 올리는 중…");
    try {
      const r = await shrink(file, 1600);
      const up = await store.upload(r.blob);
      const id = await store.addPage({ bookId: S.bookId, imageId: up.id, imageUrl: up.id ? "" : up.url, w: r.w, h: r.h, strokes: [], pageNo: "", quote: "", note: "", createdAt: Date.now() });
      busy(false);
      openEditor(id, { imageId: up.id, url: up.url, w: r.w, h: r.h, strokes: [], pageNo: "", quote: "", note: "", bookId: S.bookId, fresh: true });
    } catch (e) { console.warn("add page failed", e); busy(false); toast(errMsg(e)); }
  }

  /* ---------- editor ---------- */
  const ED = { el: null, id: null, page: null, strokes: [], tool: "mark", straight: true, cur: null, W: 0, H: 0, ctx: null, dirty: false };

  function openEditor(id, preset) {
    const p = preset || S.pages.find(p => p.id === id); if (!p) return;
    const book = S.books.find(b => b.id === (p.bookId || S.bookId)) || {};
    ED.id = id; ED.page = { ...p, imageUrl: (preset && preset.url) || "" }; ED.strokes = JSON.parse(JSON.stringify(p.strokes || [])); ED.orig = { strokes: JSON.stringify(p.strokes || []), quote: p.quote || "" }; ED.dirty = !!(preset && preset.fresh);
    const el = document.createElement("div"); el.className = "editor"; el.setAttribute("role", "dialog"); el.setAttribute("aria-label", "밑줄 긋기");
    el.innerHTML = `<div class="ed-inner">
      <div class="ed-top">
        <button class="back" id="ed-close">${backIcon()} 닫기</button>
        <div class="ttl">${esc(titleOf(book))}</div>
        <button class="btn save-btn" id="ed-save">저장</button>
      </div>
      <div class="stage" id="stage"><div class="paper" id="paper"><img id="ed-img" alt="찍은 페이지"><canvas id="ed-cv"></canvas></div></div>
      <div class="tools">
        <div class="tool-group">
          <button class="tool" data-tool="mark" aria-pressed="true"><span class="swatch-mark"></span>형광펜</button>
        </div>
        <div class="tool-group">
          <button class="tool" id="t-undo" aria-label="되돌리기">${undoIcon()} 이전으로</button>
        </div>
      </div>
      <div class="ed-fields">
        <div class="field" style="max-width:140px"><label for="ed-pg">쪽수</label><input id="ed-pg" inputmode="numeric" maxlength="8" placeholder="예: 134" value="${esc(p.pageNo || "")}"></div>
        <div class="field"><label for="ed-n">메모</label><textarea id="ed-n" rows="3" maxlength="2000" placeholder="이 문장에서 멈춘 이유를 적어 두세요">${esc(p.note || "")}</textarea></div>
        ${preset && preset.fresh ? "" : `<button class="btn danger block" id="ed-del">이 페이지 지우기</button>`}
      </div></div>`;
    document.body.appendChild(el); ED.el = el; document.body.style.overflow = "hidden";

    const img = $("#ed-img", el), cv = $("#ed-cv", el), paper = $("#paper", el);
    img.onload = () => { layout(); };
    img.onerror = () => toast("사진을 불러오지 못했어요.");
    (ED.page.imageUrl ? Promise.resolve(ED.page.imageUrl) : resolveSrc(p.imageId, p.imageUrl))
      .then(src => { ED.page.imageUrl = src; img.src = src; })
      .catch(() => toast("사진을 불러오지 못했어요."));

    function layout() {
      const nw = img.naturalWidth, nh = img.naturalHeight;
      const maxW = $("#stage", el).clientWidth, maxH = Math.max(320, window.innerHeight * 0.64);
      const k = Math.min(maxW / nw, maxH / nh);
      ED.W = Math.round(nw * k); ED.H = Math.round(nh * k);
      paper.style.width = ED.W + "px"; paper.style.height = ED.H + "px";
      const dpr = Math.min(3, window.devicePixelRatio || 1);
      cv.width = Math.round(ED.W * dpr); cv.height = Math.round(ED.H * dpr);
      ED.ctx = cv.getContext("2d"); ED.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      redraw();
    }
    ED.layout = layout;
    window.addEventListener("resize", layout);

    el.querySelectorAll("[data-tool]").forEach(b => b.onclick = () => { ED.tool = b.dataset.tool; el.querySelectorAll("[data-tool]").forEach(x => x.setAttribute("aria-pressed", x === b)); });
    $("#t-undo", el).onclick = () => { if (ED.strokes.length) { ED.strokes.pop(); ED.dirty = true; redraw(); } };
    $("#ed-close", el).onclick = () => closeEditor();
    $("#ed-save", el).onclick = saveEditor;
    ["ed-pg", "ed-n"].forEach(i => $("#" + i, el).addEventListener("input", () => { ED.dirty = true; }));
    const del = $("#ed-del", el);
    if (del) del.onclick = () => confirmSheet("이 페이지를 지울까요?", "사진과 밑줄, 적어 둔 생각이 함께 지워지고 되돌릴 수 없어요.", "지우기", async () => { await store.deletePage(ED.id); closeEditor(true); toast("페이지를 지웠어요."); });

    // drawing
    let active = null;
    const pt = (e) => { const r = cv.getBoundingClientRect(); return [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))]; };
    cv.addEventListener("pointerdown", (e) => {
      if (active !== null) { ED.cur = null; active = null; redraw(); return; } // second finger cancels
      e.preventDefault(); active = e.pointerId; try { cv.setPointerCapture(e.pointerId); } catch {}
      const [x, y] = pt(e);
      if (ED.tool === "erase") { eraseAt(x, y); return; }
      ED.cur = { t: ED.tool, p: [x, y] };
    });
    cv.addEventListener("pointermove", (e) => {
      if (e.pointerId !== active) return;
      const [x, y] = pt(e);
      if (ED.tool === "erase") { eraseAt(x, y); return; }
      if (!ED.cur) return;
      const p = ED.cur.p, lx = p[p.length - 2], ly = p[p.length - 1];
      if (Math.hypot((x - lx) * ED.W, (y - ly) * ED.H) < 2) return;
      p.push(x, y); redraw();
    });
    const end = (e) => {
      if (e.pointerId !== active) return; active = null;
      const s = ED.cur; ED.cur = null; if (!s) return;
      const xs = s.p.filter((_, i) => i % 2 === 0), ys = s.p.filter((_, i) => i % 2 === 1);
      const span = Math.hypot((Math.max(...xs) - Math.min(...xs)) * ED.W, (Math.max(...ys) - Math.min(...ys)) * ED.H);
      if (span < 8) { redraw(); return; }
      if (ED.straight) { const y = ys.reduce((a, b) => a + b, 0) / ys.length; s.p = [Math.min(...xs), y, Math.max(...xs), y]; }
      s.p = s.p.map(v => Math.round(v * 10000) / 10000);
      ED.strokes.push(s); ED.dirty = true; redraw();
    };
    cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
  }

  function eraseAt(x, y) {
    const px = x * ED.W, py = y * ED.H;
    for (let i = ED.strokes.length - 1; i >= 0; i--) {
      const p = ED.strokes[i].p, tol = ED.strokes[i].t === "mark" ? Math.max(14, ED.W * 0.02) : 14;
      for (let j = 0; j + 3 < p.length; j += 2) {
        if (segDist(px, py, p[j] * ED.W, p[j + 1] * ED.H, p[j + 2] * ED.W, p[j + 3] * ED.H) < tol) { ED.strokes.splice(i, 1); ED.dirty = true; redraw(); return; }
      }
    }
  }
  function segDist(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy;
    let t = l ? ((px - ax) * dx + (py - ay) * dy) / l : 0; t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
  }
  function redraw() {
    if (!ED.ctx) return;
    ED.ctx.clearRect(0, 0, ED.W, ED.H);
    const list = ED.cur ? ED.strokes.concat([ED.straight && ED.cur.p.length > 2 ? straightPreview(ED.cur) : ED.cur]) : ED.strokes;
    drawStrokes(ED.ctx, list, ED.W, ED.H);
    const u = ED.el && $("#t-undo", ED.el); if (u) u.disabled = !ED.strokes.length;
  }
  function straightPreview(s) {
    const xs = s.p.filter((_, i) => i % 2 === 0), ys = s.p.filter((_, i) => i % 2 === 1);
    const y = ys.reduce((a, b) => a + b, 0) / ys.length;
    return { t: s.t, p: [Math.min(...xs), y, Math.max(...xs), y] };
  }
  async function saveEditor() {
    const el = ED.el;
    const d = { strokes: ED.strokes, pageNo: $("#ed-pg", el).value.trim(), note: $("#ed-n", el).value.trim(), updatedAt: Date.now() };
    const strokesChanged = JSON.stringify(ED.strokes) !== ED.orig.strokes;
    const runOcr = !!sampleFn && ED.strokes.length > 0 && (strokesChanged || !ED.orig.quote);
    if (!ED.strokes.length) d.quote = "";
    if (runOcr) d.ocr = "pending";
    const id = ED.id, page = { ...ED.page, strokes: ED.strokes };
    busy(true);
    try {
      await store.updatePage(id, d); ED.dirty = false; closeEditor(true);
      toast(runOcr ? "저장했어요. 밑줄 문장을 글자로 옮기고 있어요." : "밑줄을 저장했어요.");
      if (runOcr) readUnderline(id, page);
    }
    catch (e) { toast(errMsg(e)); } finally { busy(false); }
  }

  /* ---------- reading text with Claude ---------- */
  const sampleFn = !!window.Tesseract;  // on-device text reading is available
  let workerP = null, queue = Promise.resolve(), warned = false;
  function getWorker() {
    if (!workerP) {
      if (!warned) { warned = true; toast("처음 한 번은 글자 인식 데이터를 받느라 조금 걸려요."); }
      workerP = Tesseract.createWorker("kor+eng", 1).catch(e => { workerP = null; throw e; });
    }
    return workerP;
  }
  // run OCR jobs one at a time
  function ocr(canvas, psm) {
    const job = queue.then(async () => {
      const w = await getWorker();
      await w.setParameters({ tessedit_pageseg_mode: psm, preserve_interword_spaces: "1" });
      return (await w.recognize(canvas)).data;
    });
    queue = job.catch(() => {});
    return job;
  }
  const cleanText = (t) => String(t || "")
    .replace(/[|_~`^]/g, "")
    .replace(/\s+/g, " ")
    .replace(/\s+([.,!?…”’)\]])/g, "$1")
    .replace(/([“‘(\[])\s+/g, "$1")
    .trim();
  async function loadBitmap(url) { const r = await fetch(url); return await createImageBitmap(await r.blob()); }
  // cut one strip of the page around a stroke, enlarged and in grayscale for better reading
  function stripCanvas(bmp, s) {
    const W = bmp.width, H = bmp.height;
    const xs = s.p.filter((_, i) => i % 2 === 0).map(v => v * W), ys = s.p.filter((_, i) => i % 2 === 1).map(v => v * H);
    const lh = Math.max(14, W * 0.032);
    const yMid = ys.reduce((a, b) => a + b, 0) / ys.length;
    let top, bot;
    if (s.t === "mark") { top = Math.min(...ys) - lh * 0.7; bot = Math.max(...ys) + lh * 0.7; }
    else { top = Math.min(...ys) - lh * 1.25; bot = Math.max(...ys) + lh * 0.1; }
    const x0 = Math.max(0, Math.min(...xs) - W * 0.015), x1 = Math.min(W, Math.max(...xs) + W * 0.015);
    top = Math.max(0, top); bot = Math.min(H, bot);
    const k = Math.min(3, Math.max(1.5, 64 / Math.max(1, bot - top)));
    const c = document.createElement("canvas");
    c.width = Math.round((x1 - x0) * k); c.height = Math.round((bot - top) * k);
    const ctx = c.getContext("2d");
    ctx.filter = "grayscale(1) contrast(1.35)";
    ctx.drawImage(bmp, x0, top, x1 - x0, bot - top, 0, 0, c.width, c.height);
    return { canvas: c, y: yMid, lh, x: Math.min(...xs) };
  }
  async function readUnderline(id, page) {
    try {
      const bmp = await loadBitmap(page.imageUrl);
      const strips = page.strokes.map(s => stripCanvas(bmp, s)).sort((a, b) => a.y - b.y || a.x - b.x);
      let out = "", prevY = null;
      for (const st of strips) {
        const d = await ocr(st.canvas, 7);
        const t = cleanText(d.text); if (!t) continue;
        if (prevY !== null) out += (st.y - prevY < st.lh * 3 ? " " : "\n");
        out += t; prevY = st.y;
      }
      await store.updatePage(id, out ? { quote: out, ocr: "done" } : { ocr: "failed" });
    } catch (e) {
      console.warn("underline read failed", e);
      try { await store.updatePage(id, { ocr: "failed" }); } catch {}
    }
  }
  // cover: take the line written in the biggest letters as the title
  async function readCover(id, blob) {
    try {
      const bmp = await createImageBitmap(blob);
      const c = document.createElement("canvas"); c.width = bmp.width; c.height = bmp.height;
      const ctx = c.getContext("2d"); ctx.filter = "grayscale(1) contrast(1.2)"; ctx.drawImage(bmp, 0, 0);
      const d = await ocr(c, 3);
      const lines = (d.lines || []).map(l => ({ t: cleanText(l.text), h: l.bbox.y1 - l.bbox.y0, c: l.confidence }))
        .filter(l => l.c > 55 && l.t.replace(/[^가-힣A-Za-z0-9]/g, "").length >= 2);
      lines.sort((a, b) => b.h - a.h);
      const title = lines.length ? lines[0].t : "";
      await store.updateBook(id, { title, ocr: title ? "done" : "failed" });
    } catch (e) {
      console.warn("cover read failed", e);
      try { await store.updateBook(id, { ocr: "failed" }); } catch {}
    }
  }

  async function addBookFromFile(file) {
    busy(true, "표지를 올리는 중…");
    try {
      const r = await shrink(file, 900);
      const up = await store.upload(r.blob);
      const d = { title: "", coverId: up.id, coverUrl: up.id ? "" : up.url, createdAt: Date.now() };
      if (sampleFn) d.ocr = "pending";
      const id = await store.addBook(d);
      S.view = "book"; S.bookId = id; render(); window.scrollTo(0, 0);
      toast("책장에 꽂았어요. 제목이 틀리면 ⋯ 메뉴에서 고칠 수 있어요.");
      if (sampleFn) readCover(id, r.blob);
    } catch (e) { toast(errMsg(e)); } finally { busy(false); }
  }
  function closeEditor(force) {
    if (!force && ED.dirty && ED.strokes.length) {
      return confirmSheet("저장하지 않고 닫을까요?", "방금 그은 밑줄과 적은 내용이 사라져요.", "저장 안 하고 닫기", async () => closeEditor(true));
    }
    if (ED.layout) window.removeEventListener("resize", ED.layout);
    if (ED.el) ED.el.remove(); ED.el = null; ED.ctx = null; document.body.style.overflow = "";
    render();
  }

  /* ---------- events ---------- */
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-act]"); if (!t) return;
    const a = t.dataset.act;
    if (a === "scrim") { if (e.target === t) closeSheet(); return; }
    if (a === "close") return closeSheet();
    if (a === "tab") { S.tab = t.dataset.tab; render(); return; }
    if (a === "add-book") return bookSheet(null);
    if (a === "open-book") { S.view = "book"; S.bookId = t.dataset.id; render(); window.scrollTo(0, 0); return; }
    if (a === "home") { S.view = "library"; render(); window.scrollTo(0, 0); return; }
    if (a === "book-menu") return bookMenu();
    if (a === "edit-page") return openEditor(t.dataset.id);
  });
  document.addEventListener("input", (e) => { if (e.target.id === "q") { S.q = e.target.value; render(); } });
  document.addEventListener("change", (e) => {
    if (e.target.dataset && e.target.dataset.file === "cover") { const f = e.target.files[0]; e.target.value = ""; if (f) addBookFromFile(f); return; }
    if (e.target.dataset && e.target.dataset.file === "page") { const f = e.target.files[0]; e.target.value = ""; if (f) { S.bookId = e.target.dataset.book; addPageFromFile(f); } return; }
    if (e.target.id === "page-file") { const f = e.target.files[0]; e.target.value = ""; if (f) addPageFromFile(f); }
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if (layer.innerHTML) closeSheet(); else if (ED.el) closeEditor(); } });

  /* ---------- icons ---------- */
  function plusIcon() { return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`; }
  function cameraIcon() { return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>`; }
  function backIcon() { return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>`; }
  function dotsIcon() { return `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>`; }
  function undoIcon() { return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6L4 11l5 5"/><path d="M4 11h10a5 5 0 010 10h-3"/></svg>`; }
  function searchIcon() { return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>`; }

  /* ---------- boot ---------- */
  function start(s, mode) {
    store = s; S.mode = mode;
    const timer = setTimeout(() => { if (!S.loaded.books) { S.err = "서재를 불러오지 못했어요. 연결을 확인하고 페이지를 다시 열어 주세요."; render(); } }, 10000);
    store.subscribe((kind, rows) => {
      S[kind] = rows; S.loaded[kind] = true; if (S.loaded.books) { clearTimeout(timer); S.err = ""; }
      if (!ED.el) render();
    }, (e) => { clearTimeout(timer); S.err = "서재를 불러오지 못했어요 (" + (e && e.code || "오류") + ")."; render(); });
    render();
  }
  async function boot() {
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch {}
    if (!window.indexedDB) { S.mode = "local"; S.err = "이 브라우저는 기록 저장을 지원하지 않아요. 사파리나 크롬으로 열어 주세요."; S.loaded.books = true; render(); return; }
    start(idbStore(), "local");
  }
  boot();
})();
</script>
</body>
